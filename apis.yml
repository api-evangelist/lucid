apis:
- aid: lucid:lucid-rest-api
  name: Lucid REST API
  description: >-
    The Lucid REST API provides programmatic access to manage documents, users, folders, sharing,
    licensing, and audit logs across the Lucid Suite (Lucidchart, Lucidspark, and Lucidscale).
    154 operations across 125 paths, covering document create/import/copy/search/export, folder
    trees, user and team collaborators, share links, embeds and the document picker, comments,
    repositories, legal holds, subscriptions and licenses, audit logs, and the Lucidscale cloud
    surfaces for AWS, Azure and Google Cloud. Authenticate via OAuth 2.0 or API key.
  humanURL: https://developer.lucid.co/reference/api
  baseURL: https://api.lucid.co
  tags:
  - Documents
  - Folders
  - Sharing
  - Users
  - Teams
  - Audit Logs
  - Cloud
  properties:
  - type: OpenAPI
    url: openapi/lucid-rest-api-openapi.yml
  - type: Documentation
    url: https://developer.lucid.co/docs/welcome
  - type: APIReference
    url: https://developer.lucid.co/reference/api
  - type: Overlay
    url: overlays/lucid-rest-api-overlay.yaml
- aid: lucid:lucid-data-api
  name: Lucid Data API
  description: >-
    The Lucid Data API enables external applications to create, read, update, and delete
    structured data linked to Lucid documents. 50 operations across data sets, data set grants
    and properties, data sources (including a CSV adapter), collections, field-definition
    schemas, and data items addressed by id or by key. Authenticate via OAuth 2.0 with the
    data-service.admin scope.
  humanURL: https://developer.lucid.co/reference/api
  baseURL: https://data.lucid.app
  tags:
  - Data
  - Collections
  - Schemas
  - Data Sets
  properties:
  - type: OpenAPI
    url: openapi/lucid-data-api-openapi.yml
  - type: APIReference
    url: https://developer.lucid.co/reference/api
  - type: Overlay
    url: overlays/lucid-data-api-overlay.yaml
- aid: lucid:lucid-scim-api
  name: Lucid SCIM API
  description: >-
    The Lucid SCIM 2.0 API enables identity providers to automatically provision and deprovision
    users and groups in a Lucid account. 15 operations over /Users, /Groups, /Schemas and
    /ServiceProviderConfig, available to Enterprise accounts with bearer-token auth.
  humanURL: https://developer.lucid.co/reference/overview-scim
  baseURL: https://users.lucid.app/scim/v2
  tags:
  - SCIM
  - Identity
  - Provisioning
  properties:
  - type: OpenAPI
    url: openapi/lucid-scim-api-openapi.yml
  - type: APIReference
    url: https://developer.lucid.co/reference/overview-scim
  - type: Overlay
    url: overlays/lucid-scim-api-overlay.yaml
- aid: lucid:lucid-mcp-server
  name: Lucid MCP Server
  description: >-
    Lucid's remote Model Context Protocol server. Connects AI clients (ChatGPT, Claude, Microsoft
    Copilot, Cursor) to Lucid documents so they can be searched, retrieved, edited, summarized
    and created in natural language. OAuth 2.0 protected, with RFC 9728 protected-resource
    metadata, RFC 8414 authorization-server metadata and RFC 7591 dynamic client registration.
  humanURL: https://developer.lucid.co/docs/mcp
  baseURL: https://mcp.lucid.app/mcp
  tags:
  - MCP
  - Agents
  - AI
  properties:
  - type: MCPServer
    url: mcp/lucid-mcp.yml
  - type: ToolCrosswalk
    url: mcp/lucid-tool-crosswalk.yml
  - type: Documentation
    url: https://developer.lucid.co/docs/mcp
- aid: lucid:lucid-chatgpt-plugin-api
  name: Lucid ChatGPT Plugin API
  description: >-
    The API behind Lucid's ChatGPT plugin — accepts Mermaid diagram source and returns a rendered
    image link plus, for flowcharts, an editable Lucidchart link. Described by the OpenAPI that
    Lucid's /.well-known/ai-plugin.json manifest points at.
  humanURL: https://lucid.app/.well-known/ai-plugin.json
  baseURL: https://mlai.lucid.app
  tags:
  - AI
  - Mermaid
  - Diagramming
  properties:
  - type: OpenAPI
    url: openapi/lucid-chatgpt-plugin-openapi.yaml
