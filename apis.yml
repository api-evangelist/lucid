aid: lucid
name: Lucid
url: https://raw.githubusercontent.com/api-evangelist/lucid/refs/heads/main/apis.yml
description: >-
  Lucid Software Inc. is the visual collaboration company behind the Lucid Suite — Lucidchart
  (intelligent diagramming), Lucidspark (virtual whiteboarding) and Lucidscale (cloud
  visualization) — plus the Lucid Cloud, Process and Enterprise Shield accelerators and airfocus.
  The Lucid Developer Platform at developer.lucid.co publishes three OpenAPI-described surfaces:
  the Lucid REST API on api.lucid.co for documents, folders, sharing, embeds, comments, teams,
  repositories, legal holds, licenses and audit logs; the Lucid Data API on data.lucid.app for
  the structured data sets, collections, schemas and data items that back data-linked diagrams;
  and a SCIM 2.0 API on users.lucid.app for enterprise user and group provisioning. Lucid also
  ships an in-editor Extension API (lucid-extension-sdk plus the lucid-package CLI), an Embed
  SDK, and an OAuth-gated remote MCP server at mcp.lucid.app that lets AI clients search, read,
  edit and create Lucid documents. Lucid is privately held and trades on secondary markets.
