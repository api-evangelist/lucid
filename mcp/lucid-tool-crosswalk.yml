summary: >-
  Lucid's two MCP servers and its REST surface are genuinely different projections. The
  documentation MCP server (anonymous, 6 tools captured live) exposes NO product operations at
  all — it is a meta-surface over the OpenAPI specs plus two extension-authoring tools, so every
  one of its tools is mcp_only. The product MCP server (mcp.lucid.app) is OAuth-gated and its
  tools/list returned 401, so its tools cannot be bound to operationIds without fabricating the
  mapping; it is recorded as unresolved rather than guessed. That leaves all 219 REST operations
  as rest_only for now.

