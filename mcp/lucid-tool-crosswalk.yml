  server: lucid-developer-docs
  reason: Documentation meta-tool; returns paths+methods+summaries for one spec. No REST operation backs it.
- tool: get-endpoint
  server: lucid-developer-docs
  reason: Documentation meta-tool; returns a verbatim OpenAPI fragment for one path+method. No REST operation backs it.
- tool: search-endpoints
  server: lucid-developer-docs
  reason: Documentation meta-tool; keyword search across paths/operations/parameters. No REST operation backs it.
- tool: extension-sdk
  server: lucid-developer-docs
  reason: Code-authoring tool for the lucid-extension-sdk (client-side editor extension API). The Extension API is a browser SDK, not a REST surface.
- tool: build-extension
  server: lucid-developer-docs
  reason: Scaffolds a lucid-package project. Local tooling, not a REST operation.

