    Items:
      type: object
      properties:
        shapes:
          type: array
          items:
            $ref: '#/components/schemas/Shape'
          description: Array of Shape resources
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
          description: Array of Line resources
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
          description: Array of Group resources
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
          description: Array of Layer resources
      description: Individual shapes, lines, groups, and layers all contain a unique ItemId identifying the object.
      required:
      - shapes
      - lines
      - groups
      - layers
    Shape:
      type: object
      properties:
        id:
          type: string
          description: Shape ID
          example: VTAu-oQASzul
        class:
          type: string
          description: A unique string representing the type of the shape (e.g., ProcessBlock)
          example: ProcessBlock
        textAreas:
          type: array
          items:
            $ref: '#/components/schemas/TextArea'
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
        contains:
          $ref: '#/components/schemas/Contains'
          description: If the shape is a container (e.g., a frame), lists the IDs of shapes, lines, and groups contained within it
        image:
          $ref: '#/components/schemas/Image'
          description: If the shape has an image fill, describes the image
        linkUrl:
          type: string
          description: The external website or destination URL attached to the shape, if configured.
          example: https://example.com
      required:
      - id
      - class
      - textAreas
      - customData
      - linkedData
      description: Object representing a shape placed on a page of a document. Note that the ItemId of a shape is unique across all groups, layers, shapes, and lines.
    CreatableProduct:
      type: string
      enum:
      - lucidchart
      - lucidspark
      description: The Lucid Suite product types that can be created.
      example: lucidchart
    LinkedData:
      type: object
      properties:
        collection_id:
          type: string
          description: Id of the collection containing the data
          example: ABAuwlf2BTy8
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
          description: Key-value pairs from the dataset
        primaryKeyValue:
          type: string
          description: The value of the primary key of the dataset
          example: Pkey Value
      description: Object representing data linked to a resource on a document.
      required:
      - data
      - primaryKeyValue
    DocumentOwner:
      type: object
      properties:
        id:
          type: number
          description: Id of either the user or the account, depending on the type of the document user resource.
          example: 123456
        type:
          type: string
          description: Specifies if the owner resource is referring to a user or an account. Value will be either "user" or "account".
          example: user
        name:
          type: string
          description: Full name of the user that owns this document. This field is excluded if this document is owned by an account.
          example: John Doe
    DocumentContent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Document ID
          example: 8e7b19ec-27ff-40e3-beb8-03f51b1661b2
        title:
          type: string
          description: Title of the document
          example: document title
        product:
          $ref: '#/components/schemas/Product'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
          description: Array of Page resources on the document
        accountId:
          type: integer
          description: ID of Lucid account that owns the document
        data:
          $ref: '#/components/schemas/Data'
          description: Data contained on the document
      description: Object representing the contents of a Lucidchart document
      required:
      - id
      - title
      - product
      - pages
      - accountId
      - data
      example:
        id: 8e7b19ec-27ff-40e3-beb8-03f51b1661b2
        title: document title
        product: lucidchart
        pages: []
        accountId: 1234
        data:
          collections: []
    Collection:
      type: object
      properties:
        id:
          type: string
          description: Id of the collection
          example: ABAuwlf2BTy8
        name:
          type: string
          description: Collection name
          example: Collection 1
        primaryKey:
          type: array
          items:
            type: string
          description: The primary key column name
          example:
          - PKey 1
      required:
      - id
      - name
      - primaryKey
      description: A collection is a container inside of a source of data. A data source can have many collections, but a collection can only belong to one data source. A collection can be thought of as a tab or individual sheet in a spreadsheet file.
    LucidStandardImportPage:
      type: object
      description: A page definition within a Lucid Standard Import document.
      properties:
        id:
          type: string
          description: Unique identifier for the page within the import.
          example: page1
        title:
          type: string
          description: The title of the page.
          example: Page 1
        shapes:
          type: array
          description: List of shapes to place on the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportShape'
        lines:
          type: array
          description: List of lines to place on the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportLine'
        groups:
          type: array
          description: List of groups to create on the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportGroup'
        layers:
          type: array
          description: List of layers to create on the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportLayer'
        customData:
          type: array
          description: Custom key-value data to attach to the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomPageDatum'
        dataBackedShapes:
          type: array
          description: List of data-backed shape generators (e.g., org charts, mind maps).
          items:
            $ref: '#/components/schemas/LucidStandardImportGenerator'
        settings:
          $ref: '#/components/schemas/LucidStandardImportPageSettings'
      required:
      - id
      - title
    BoundingBox:
      type: object
      description: The bounding box that defines a shape's position and size on the page.
      properties:
        x:
          type: number
          description: The x-coordinate of the top-left corner.
          example: 0
        y:
          type: number
          description: The y-coordinate of the top-left corner.
          example: 0
        w:
          type: number
          description: The width of the bounding box.
          example: 100
        h:
          type: number
          description: The height of the bounding box.
          example: 50
      required:
      - x
      - y
      - w
      - h
    CustomAttribute:
      type: object
      properties:
        type:
          type: string
          enum:
          - singleLineText
          - multiLineText
          - singleSelectDropdown
          - multiSelectDropdown
          - webLink
          - numericalRange
          - hierarchicalDropdown
          description: The custom attribute type
          example: singleLineText
        name:
          type: string
          description: Title of the custom attribute. hierarchicalDropdown attributes do not have names.
          example: Sample Label
        value:
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/DataPair'
              - type: string
          description: The value assigned to the custom attribute. The type of this value is determined by the Attribute Type.
          example: null
      description: Object representing a custom attribute value for a document.
      required:
      - type
    LucidStandardImportLineText:
      type: object
      description: A text label on a line.
      properties:
        text:
          type: string
          description: The text content.
        position:
          type: number
          description: Relative position along the line (0 to 1 inclusive).
          default: 0.5
          minimum: 0
          maximum: 1
        side:
          type: string
          description: Which side of the line the text appears on.
          enum:
          - top
          - middle
          - bottom
          default: middle
      required:
      - text
    Image:
      type: object
      properties:
        type:
          type: string
          enum:
          - resource
          - user
          description: Whether the image is a Lucid resource image (`resource`) or a user-uploaded image (`user`)
          example: resource
        id:
          type: string
          description: The ID of the resource image. Present when type is `resource`.
          example: T2VkijPHy1qh
        url:
          type: string
          description: The URL of the user-uploaded image. Present when type is `user`.
          example: https://example.com/image.png
      required:
      - type
      description: Object describing the image fill on a shape.
    LucidStandardImportAction:
