    LucidStandardImportPageSize:
      description: 'Page size configuration. Either a standard page size with an optional format, or a custom size with explicit dimensions.

        '
      oneOf:
      - $ref: '#/components/schemas/LucidStandardImportStandardPageSize'
      - $ref: '#/components/schemas/LucidStandardImportCustomPageSize'
    LucidStandardImportShapeEndpoint:
      type: object
      description: An endpoint connected to a shape.
      properties:
        type:
          type: string
          enum:
          - shapeEndpoint
        style:
          $ref: '#/components/schemas/EndpointStyle'
        shapeId:
          type: string
          description: The ID of the shape to connect to.
          example: shape1
        position:
          $ref: '#/components/schemas/RelativePoint'
          description: Optional relative position on the shape to connect to. If omitted, uses smart auto-linking.
      required:
      - type
      - style
      - shapeId
    RelativePoint:
      type: object
      description: A relative point with coordinates between 0 and 1, inclusive.
      properties:
        x:
          type: number
          description: The relative x-coordinate (0 to 1).
          minimum: 0
          maximum: 1
        y:
          type: number
          description: The relative y-coordinate (0 to 1).
          minimum: 0
          maximum: 1
      required:
      - x
      - y
    LucidStandardImportCustomPageDatum:
      type: object
      description: A custom key-value pair attached to a page, optionally globally inherited.
      properties:
        key:
          type: string
          description: The data key.
        value:
          type: string
          description: The data value.
        global:
          type: boolean
          description: When true, this data is globally inherited.
          default: false
      required:
      - key
      - value
    TextArea:
      type: object
      properties:
        label:
          type: string
          description: Text area label
          example: Text
        text:
          type: string
          description: Text displayed in the text area. This is plain text. All formatting has been removed & formulas evaluated.
          example: Start here
      description: Object representing a text area on a Shape or Line.
      required:
      - label
      - text
    LucidStandardImportImageFill:
      type: object
      description: An image fill, either by URL or by reference to an image in the import archive.
      properties:
        type:
          type: string
          enum:
          - image
        url:
          type: string
          description: URL of the image. Use this or `ref`, not both.
          example: https://example.com/image.png
        ref:
          type: string
          description: Reference to an image in the import archive. Use this or `url`, not both.
        imageScale:
          type: string
          description: How the image should be scaled within the shape.
          enum:
          - fill
          - page
          - shape
      required:
      - type
    LucidStandardImportCustomDatum:
      type: object
      description: A custom key-value pair attached to an item.
      properties:
        key:
          type: string
          description: The data key.
        value:
          type: string
          description: The data value.
      required:
      - key
      - value
    LucidStandardImportFill:
      description: 'Fill style for a shape. The `type` field determines the fill kind.

        - `color`: A solid color fill.

        - `image`: An image fill, either by URL or by reference to an image in the import archive.

        '
      discriminator:
        propertyName: type
        mapping:
          color: '#/LucidStandardImportColorFill'
          image: '#/LucidStandardImportImageFill'
      oneOf:
      - $ref: '#/components/schemas/LucidStandardImportColorFill'
      - $ref: '#/components/schemas/LucidStandardImportImageFill'
    Endpoint:
      type: object
      properties:
        style:
          type: string
          description: Line end style
          example: Arrow
        connectedTo:
          type:
          - string
          - 'null'
          description: Id of shape or line the line is connected to
          example: null
      description: Object representing the endpoint of a Line.
      required:
      - style
      - connectedTo
    DataPair:
      type: object
      properties:
        name:
          type: string
          description: Custom data key
        value:
          type: string
          description: Custom data value
      description: Object representing a key-value pair of data.
      required:
      - name
      - value
      example:
        name: City
        value: New York
    LucidStandardImportEndpoint:
      type: object
      description: 'An endpoint of a line. The `type` field determines how the endpoint is positioned.

        - `shapeEndpoint`: Connects to a shape by its ID.

        - `positionEndpoint`: Connects to an absolute position on the page.

        - `lineEndpoint`: Connects to another line at a relative position.

        '
      discriminator:
        propertyName: type
        mapping:
          shapeEndpoint: '#/LucidStandardImportShapeEndpoint'
          positionEndpoint: '#/LucidStandardImportPositionEndpoint'
          lineEndpoint: '#/LucidStandardImportLineEndpoint'
      oneOf:
      - $ref: '#/components/schemas/LucidStandardImportShapeEndpoint'
      - $ref: '#/components/schemas/LucidStandardImportPositionEndpoint'
      - $ref: '#/components/schemas/LucidStandardImportLineEndpoint'
    BootstrapData:
      type: object
      properties:
        packageId:
          type: string
          description: Id of the extension package which will consume this data
          example: 74672098-cf36-492c-b8e6-2c4233549cd3
        extensionName:
          type: string
          description: Name of the editor extension which will consume this data. Note this is the name field of an editor extension found in your manifest.json file.
          example: sheets-adapter
        minimumVersion:
          type: string
          description: Minimum version of the extension package which will consume this data
          example: 1.4.0
        data:
          type: object
          additionalProperties:
            type: string
          description: Data to provide to the extension package
          example:
            a: 1
            b: 2
      required:
      - packageId
      - extensionName
      - minimumVersion
      - data
      description: Bootstrap data can be attached to the created document to be consumed by a specific Extension Package.
    LucidStandardImportDocumentSettings:
      type: object
      description: Document-level settings for a Lucid Standard Import.
      properties:
        units:
          type: string
          description: The measurement unit for the document. Defaults to inches (`in`) if not specified.
          enum:
          - in
          - cm
          - px
          - pt
          default: in
          example: in
    Layer:
      type: object
      properties:
        id:
          type: string
          description: Layer ID
          example: VTAu-dl6qtyx
        name:
          type: string
          description: The name of the layer
          example: Layer 1
        members:
          type: array
          items:
            type: string
          description: Array of IDs of shapes, lines, & groups contained within the layer
          example:
          - VTAuCB8~evzW
          - VTAuo_Y56.q~
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
      description: Object representing a layer on the page of a document. Note that the ItemId of a layer is unique across all groups, layers, shapes, and lines.
      required:
      - id
      - name
      - members
      - customData
      - linkedData
    LucidStandardImportGotoPageAction:
      type: object
      description: Navigate to a page in the current document.
      properties:
        type:
          type: string
          enum:
          - gotoPage
        pageId:
          type: string
          description: The ID of the target page.
          example: page2
      required:
      - type
      - pageId
    LucidStandardImportCustomPageSize:
      type: object
      description: A custom page size with explicit dimensions.
      properties:
        w:
          type: number
          description: Width of the page. Must be between 1.0 and 20000.0, inclusive.
          minimum: 1
          maximum: 20000
        h:
          type: number
          description: Height of the page. Must be between 1.0 and 20000.0, inclusive.
          minimum: 1
          maximum: 20000
      required:
      - w
      - h
    LucidStandardImportLayer:
      type: object
      description: A layer on a page. Layers can contain shapes, lines, and groups.
      properties:
        id:
          type: string
          description: Unique identifier for the layer.
          example: layer1
        title:
          type: string
          description: The display name of the layer.
          example: Background
        items:
          type: array
          description: 'List of item IDs (shapes, lines, groups) contained in this layer. An item can belong to only one layer. If an item ID is specified in multiple layers, it is assigned to the first layer encountered, and all subsequent references to that item ID are ignored.

            '
          items:
            type: string
        customData:
          type: array
          description: Custom key-value data to attach to the layer.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomDatum'
        linkedData:
          type: array
          description: Links to data collection entries.
          items:
            $ref: '#/components/schemas/LucidStandardImportLinkedDatum'
        note:
          type: string
          description: A note to attach to the layer.
        layerIndex:
          type: integer
          description: The index order of the layer.
      required:
      - id
      - title
  parameters:
    RequestAs-AccountDocuments:
      in: header
      name: Lucid-Request-As
      required: true
      description: 'If the requesting user is an account owner or document admin with the required permissions and they make the request

        with the value of “admin” as this header and include an admin scope, the request will be made using their admin

        permissions.

        '
      schema:
        type: string
      example: admin
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://lucid.app/oauth2/authorize
          tokenUrl: https://api.lucid.co/oauth2/token
          refreshUrl: https://api.lucid.co/oauth2/token
          scopes:
            account.audit.logs: View audit logs on your account.
            account.info: View basic information about your account (e.g., account ID and account name) .
            account.user: Create, view, edit, and delete users on your account.
            account.user:readonly: View users on your account.
            account.users:admin.readonly: View all users and their roles on your account.
            account.user.transfercontent: Transfer ownership of a user's resources to another user on your account.
            account.settings:readonly: View settings on your account.
            account.legalhold: Create, view, and expire legal holds on your account.
            account.legalhold:readonly: View legal holds on your account.
            account.legalhold.users: Manage legal hold users on your account.
            account.legalhold.users:readonly: View legal hold users on your account.
            folder: Create, view, edit, share, and delete your folders. Organize your folders and their contents.
            folder:readonly: View any of your folders and list their contents.
            folder:admin: Perform admin actions on folders belonging to the account.
            folder:admin.readonly: View all folders belonging to the account with admin permissions.
            invitation: Accept document and folder share links.
            invitation.accept: Accept document and folder share links.
            cloud.credential: Manage cloud credentials.
            cloud.credential:readonly: View cloud credentials.
            cloud.datasource: Manage cloud data sources.
            cloud.datasource:readonly: View cloud data sources.
            cloud.model: Manage cloud models.
            repository: Manage repositories.
            repository:readonly: View repositories.
            repository:admin: Perform admin actions on repositories.
            lucid.document.content: Create, view, edit, and delete any Lucid document accessible by the user.
            lucid.document.content:readonly: View and download any Lucid document accessible by the user.
            lucid.document.content:admin: Perform admin actions on Lucid documents belonging to the account.
