openapi: 3.2.0
info:
  title: Lucid REST Document Access API
  version: '1.0'
  description: The Lucid REST API provides programmatic access to manage documents, users, folders, sharing, licensing, and audit logs across the Lucid Suite (Lucidchart, Lucidspark, and Lucidscale). Authenticate via OAuth 2.0 or API key.
  contact:
    name: Lucid Developer Platform
    url: https://developer.lucid.co/
  x-documentation: https://developer.lucid.co/reference/api
servers:
- url: https://api.lucid.co
tags:
- name: Document Access
  description: Create, import, copy, retrieve, update, search, export, and trash documents across the Lucid Suite, and access their contents.
paths:
  /v1/accounts/me/documents/search:
    post:
      summary: Search Account Documents
      description: Returns a list of all documents belonging to the requesting user's account, sorted by created date. This API is exclusive to Enterprise Shield accounts. The endpoint supports pagination and has a per-account rate limit of 300 requests per 5 seconds.
      operationId: SearchAccountDocuments
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentAdmin
      - OAuth2:
        - lucidchart.document.content:admin.readonly
        - lucidspark.document.content:admin.readonly
        - lucidscale.document.content:admin.readonly
      parameters:
      - $ref: '#/components/parameters/RequestAs-AccountDocuments'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: number
                  description: 'When provided, limit the search to documents that at least one specified user can access.

                    If no list is provided, search across the entire account.

                    '
                ownedByUsers:
                  type: boolean
                  description: When true, search results will only include documents owned by users specified by userIds. Ignored if no userIds are provided.
                documentIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of documentIds to filter by.
                classificationIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of classificationIds to filter by.
                statusIds:
                  type: array
                  items:
                    type: number
                  description: List of statusIds to filter by.
                createdStartTime:
                  type: string
                  format: date-time
                  description: Start of range to filter documents by created time.
                createdEndTime:
                  type: string
                  format: date-time
                  description: End of range to filter documents by created time.
                lastModifiedStartTime:
                  type: string
                  format: date-time
                  description: Start of range to filter documents by last modified time.
                lastModifiedEndTime:
                  type: string
                  format: date-time
                  description: End of range to filter documents by last modified time.
                product:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                  description: Array of Lucid Suite products to filter by. Default value assumes all valid products for the given scopes.
                  default:
                  - lucidchart
                  - lucidscale
                  - lucidspark
                keywords:
                  type: string
                  description: Keyword(s) to search against document content and titles. When provided, results will be sorted by relevance to keyword search. Use quotes to search for exact phrases (e.g. "Project X")
                documentLocation:
                  type: string
                  enum:
                  - team folders
                  - users
                  - deleted
                  - repositories
                  description: Specify to search for documents in team folders, owned by users, deleted, or contained within repositories
                externalAccess:
                  type: string
                  enum:
                  - any
                  - external-collaborators
                  - external-links
                  description: Specify to search for documents with either “any” type of external access, “external-collaborators”, or "external-links"
      responses:
        '200':
          description: With paginated list of Account Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountDocument'
        '400':
          description: Bad Request if incorrect format
        '403':
          description: Forbidden if "product" query parameter is used and the token’s scopes do not contain the matching readonly scope for each product, or account does not have access to the API
        '429':
          description: Too Many Requests if account makes more than 300 requests in 5 seconds
  /v1/documents:
    post:
      summary: Create Document
      description: 'Creates a new document for the requesting user, with the specified title. Requires `title` and `product`. Optionally, a `parent` folder, `extensionBootstrapData`, or Lucid Standard Import `content` can be provided to customize the new document.


        > 📘

        >

        > This endpoint can only create a new Lucidchart or Lucidspark document. It cannot modify an existing document''s contents.


        > 📘 ##### Document Creation Location

        >

        > When there is no `parent` field on the request, the new document will be created in a default location depending on the authorizing token''s scopes.

        >

        > - If the token authorizing the request uses one of the `document.app` scopes, then the document will be created in an `app-specific folder`.

        > - If one of the `document.content` scopes is used, the document will be created in the user''s ''My Documents folder''.

        > - If both types of scopes are authorized on the token, the `document.content` behavior will take priority and the document will be created in the user''s ''My Documents'' folder.


        > 📘 ##### Bootstrap Data for Create Document

        >

        > Bootstrap data can be attached to the created document to be consumed by a specific [Extension Package](https://lucid.readme.io/docs/lucid-extension-api). See [Bootstrap Data for documents created via API](https://lucid.readme.io/docs/editor-extension-data#bootstrap-data-for-documents-created-via-api) for usage.


        > 📘 Standard Import

        >

        > When `content` is provided, it must conform to the Lucid Standard Import schema. For more information on how to use the Standard Import, refer to the extensive reference documentation [here](doc:overview-si).

        >

        > For examples of how to use the Standard Import, refer to the `/standard-import` folder in Lucid''s repository of [Sample Lucid REST Applications](https://github.com/lucidsoftware/sample-lucid-rest-applications/tree/main/standard-import). This repo also contains some example `.zip` Standard Import files you can reference or use in your own projects.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidchart.document.app.folder`

        - `lucidspark.document.content`

        - `lucidspark.document.app.folder`

        '
      operationId: createDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - product
              properties:
                title:
                  type: string
                  description: Title that should be given to the newly created document.
                product:
                  $ref: '#/components/schemas/CreatableProduct'
                parent:
                  type: number
                  description: Folder ID for the new document.
                extensionBootstrapData:
                  $ref: '#/components/schemas/BootstrapData'
                content:
                  $ref: '#/components/schemas/LucidStandardImportContent'
      responses:
        '201':
          description: 'Created with Document resource containing information about the newly created document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request. * `'content' and 'extensionBootstrapData' cannot both be provided` — the `content` field is mutually exclusive with `extensionBootstrapData`. * Invalid `content` JSON — the provided content does not conform to the Lucid Standard Import schema.
        '403':
          description: Forbidden. * if the user doesn't have access to or permissions to create within the specified parent folder. * if the token authorizing the request has the document.app scope with a specified parent folder that is outside the app folder's folder tree.
  /v1/documents/create:
    post:
      summary: Create Document with Standard Import File
      description: 'Creates a new document from a Lucid Standard Import file (`.zip` archive) uploaded as multipart/form-data. Requires `file`, `type`, and `product`. Optionally, a `title` and `parent` folder can be provided. If no `title` is provided, the new document''s title will be the imported filename.


        > 📘

        >

        > This endpoint can only create a new Lucidchart or Lucidspark document. It cannot modify an existing document''s contents.


        > 📘 ##### Document Creation Location

        >

        > When there is no `parent` field on the request, the new document will be created in a default location depending on the authorizing token''s scopes.

        >

        > - If the token authorizing the request uses one of the `document.app` scopes, then the document will be created in an `app-specific folder`.

        > - If one of the `document.content` scopes is used, the document will be created in the user''s ''My Documents folder''.

        > - If both types of scopes are authorized on the token, the `document.content` behavior will take priority and the document will be created in the user''s ''My Documents'' folder.


        > 📘 Standard Import

        >

        > For more information on how to use the Standard Import, refer to the extensive reference documentation [here](doc:overview-si).

        >

        > For examples of how to use the Standard Import, refer to the `/standard-import` folder in Lucid''s repository of [Sample Lucid REST Applications](https://github.com/lucidsoftware/sample-lucid-rest-applications/tree/main/standard-import). This repo also contains some example `.zip` Standard Import files you can reference or use in your own projects.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidchart.document.app.folder`

        - `lucidspark.document.content`

        - `lucidspark.document.app.folder`

        '
      operationId: createDocumentWithStandardImport
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - type
              - product
              properties:
                file:
                  type: string
                  format: binary
                  description: The Lucid Standard Import specification (`.zip` archive) from which to create the document.
                type:
                  type: string
                  enum:
                  - x-application/vnd.lucid.standardImport
                product:
                  $ref: '#/components/schemas/CreatableProduct'
                title:
                  type: string
                  description: Title that should be given to the newly created document. If no title is specified, the document will be automatically assigned the file name.
                parent:
                  type: number
                  description: Folder ID for the new document.
      responses:
        '201':
          description: 'Created with Document resource containing information about the newly created document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: 'Bad Request.

            * Invalid request body — the provided payload does not conform to the Lucid Standard Import schema.

            '
        '403':
          description: 'Forbidden.

            * if the user doesn''t have access to or permissions to create within the specified parent folder.

            * if the token authorizing the request has the document.app scope with a specified parent folder that is outside the app folder''s folder tree.

            * if the token does not have the correct scope for the import type.

            '
        '415':
          description: Unsupported Media Type. The file type provided is not supported.
  /v1/documents/import:
    post:
      summary: Import Document
      description: 'Imports an external non-Lucid file as a new document within Lucid. The file is uploaded as multipart/form-data. Requires `file`, `type`, and `product`. Optionally, a `title` and `parent` folder can be provided. If no `title` is provided, the new document''s title will be the imported filename.


        > 📘

        >

        > This endpoint can only create a new Lucidchart or Lucidspark document. It cannot modify an existing document''s contents.


        > 📘 ##### Document Creation Location

        >

        > When there is no `parent` field on the request, the new document will be created in a default location depending on the authorizing token''s scopes.

        >

        > - If the token authorizing the request uses one of the `document.app` scopes, then the document will be created in an `app-specific folder`.

        > - If one of the `document.content` scopes is used, the document will be created in the user''s ''My Documents folder''.

        > - If both types of scopes are authorized on the token, the `document.content` behavior will take priority and the document will be created in the user''s ''My Documents'' folder.


        > 📘 Board import

        >

        > - The `board` import type only accepts pdfs that are exports of digital whiteboards.

        > - The `board` import type can only be authorized by users with a Lucidspark Enterprise license.

        > - The `board` import type is experimental and importing the same board may produce varying results over time.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidchart.document.app.folder`

        - `lucidspark.document.content`

        - `lucidspark.document.app.folder`

        '
      operationId: importDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - type
              - product
              properties:
                file:
                  type: string
                  format: binary
                  description: The file from which to import the document.
                type:
                  type: string
                  enum:
                  - x-application/vnd.lucid.drawio
                  - x-application/vnd.lucid.visio
                  - x-application/vnd.lucid.gliffy
                  - x-application/vnd.lucid.board
                  description: 'The type of file provided for import. Supported types:

                    * `x-application/vnd.lucid.drawio` — draw.io files (.drawio, .xml) for Lucidchart

                    * `x-application/vnd.lucid.visio` — Visio files (.vsdx, .vdx) for Lucidchart

                    * `x-application/vnd.lucid.gliffy` — Gliffy files (.gliffy, .gon, .gxml) for Lucidchart

                    * `x-application/vnd.lucid.board` — Board files (.pdf) for Lucidspark

                    '
                product:
                  $ref: '#/components/schemas/CreatableProduct'
                title:
                  type: string
                  description: Title that should be given to the newly imported document. If no title is specified, the document will be automatically assigned the file name.
                parent:
                  type: number
                  description: Folder ID for the new document.
      responses:
        '201':
          description: 'Created with Document resource containing information about the newly imported document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          description: 'Forbidden.

            * if the user doesn''t have access to or permissions to create within the specified parent folder.

            * if the token authorizing the request has the document.app scope with a specified parent folder that is outside the app folder''s folder tree.

            * if the token does not have the correct scope for the import type.

            * if the token requesting a board import does not have a Lucidspark Enterprise License.

            '
        '415':
          description: Unsupported Media Type. The file type provided is not supported.
  /v1/documents/copy:
    post:
      summary: Copy Document
      description: 'Copies one of the requesting user''s existing documents, with the specified title. Requires `title` and `template` (the ID of the document to copy). Optionally, a `parent` folder can be provided. Note that collaborator permissions are not transferred to the copied document.


        > 📘

        >

        > This endpoint can only create a new Lucidchart or Lucidspark document. It cannot modify an existing document''s contents.


        > 📘 ##### Document Creation Location

        >

        > When there is no `parent` field on the request, the new document will be created in a default location depending on the authorizing token''s scopes.

        >

        > - If the token authorizing the request uses one of the `document.app` scopes, then the document will be created in an `app-specific folder`.

        > - If one of the `document.content` scopes is used, the document will be created in the user''s ''My Documents folder''.

        > - If both types of scopes are authorized on the token, the `document.content` behavior will take priority and the document will be created in the user''s ''My Documents'' folder.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidchart.document.app.folder`

        - `lucidspark.document.content`

        - `lucidspark.document.app.folder`

        '
      operationId: copyDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - template
              properties:
                title:
                  type: string
                  description: Title that should be given to the copied document.
                template:
                  type: string
                  format: uuid
                  description: ID of the document to copy.
                parent:
                  type: number
                  description: Folder ID for the new document.
      responses:
        '201':
          description: 'Created with Document resource containing information about the newly copied document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          description: 'Forbidden.

            * if the user doesn''t have access to or permissions to create within the specified parent folder.

            * if the user doesn''t have permissions to access the specified template to copy from.

            * if the token authorizing the request has the document.app scope with a specified parent folder that is outside the app folder''s folder tree.

            '
  /v1/documents/{id}:
    get:
      summary: Get/Export Document
      description: 'Retrieves information about the requested document or exports it as an image.


        **Get Document:** Requires at least read-only access. Document owner information is only returned if the requesting user has view access and the document is unpublished. If published, the user must be at least a collaborator.


        **Export Document:** Exports a given document in a specified image format. When exporting oversized images, the resolution may be automatically scaled down to enable performant API requests.


        **Admin flow:** Account owners and document admins can access any document belonging to their account without needing a direct share by setting the `Lucid-Request-As: admin` header and authenticating with an admin scope or `DocumentAdmin` API key grant.

        '
      operationId: getOrExportDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentReadonly
        - DocumentAdmin
      - OAuth2:
        - lucidchart.document.content:readonly
        - lucidchart.document.content:admin.readonly
        - lucidchart.document.app.picker:readonly
        - lucidchart.document.app.folder
        - lucidscale.document.content:readonly
        - lucidscale.document.content:admin.readonly
        - lucidscale.document.app.picker:readonly
        - lucidscale.document.app.folder
        - lucidspark.document.content:readonly
        - lucidspark.document.content:admin.readonly
        - lucidspark.document.app.picker:readonly
        - lucidspark.document.app.folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to be retrieved or exported.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      - name: Lucid-Request-As
        in: header
        required: false
        description: 'If the requesting user is an account owner or document admin with the required permissions and they make the

          request with the value of "admin" as this header and include an admin scope or `DocumentAdmin` API key grant,

          the request will be made using their admin permissions and will succeed for any document belonging to their

          account.

          '
        schema:
          type: string
        example: admin
      - name: Accept
        in: header
        description: "When using the Export Document API, the format of the exported document is set via the `Accept` header. This header contains up to two parts, separated by a semicolon:\n  * A prefix stating which type of image you would like the document exported as. Options are:\n    * `image/jpeg`\n    * `image/png`\n  * Optionally, you can also supply the dots per inch (DPI) you want the exported image to have. If this value is not provided, a default of 160 will be used. For example:\n    * `image/png;dpi=256`\n    * `image/jpeg;dpi=64`"
        required: false
        schema:
          type: string
          example: image/png
      - name: page
        in: query
        description: 1-based page index of the document to export. Defaults to the first page. Only a single page is allowed. Optional for export operation. Cannot be provided when pageId is provided.
        required: false
        schema:
          type: number
          default: 1
      - name: pageId
        in: query
        description: Specific page of the document to export. Only a single page is allowed. Optional for export operation. Cannot be provided when page is provided.
        example: J~65X_X714o2
        required: false
        schema:
          type: string
      - name: crop
        in: query
        description: "Specifies the crop settings for the document export. Optional for export operation. Possible values are\n  * Default (no crop parameter) - Exports the entire page canvas area that contains your content. Automatically adjusts to include all items on the page, including the space between them and maintains the relative positioning and spacing of your document elements\n  * `x, y, width, height` - Crop to the specified region (in pixels) on the page. Example crop=1000,300,30,7\n    * Note: The region (in pixels) is accurate to the number of pixels on the canvas. The number of pixels of the outputted image will only match the crop window at a DPI of 160.\n  * `content` - Crop to page content. Example crop=content"
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK with Document resource containing information about the requested document or the binary data in the response body for exports. The Accept header specifies the type of image for exports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request. More than one page and/or pageId was provided for export.
        '403':
          description: Forbidden. The app making the request does not have permission to the document, or if the document has been deleted or does not exist.
        '404':
          description: Not Found. The specified page or pageID could not be found for export.
        '406':
          description: Not Acceptable. The specified image type is not supported for export.
        '429':
          description: Too Many Requests. If the account makes more than 75 requests in 5 seconds.
    patch:
      summary: Update Document
      description: 'Updates properties of an existing document. Supports partial updates via JSON for title, parent, and classification.


        Supports moving documents into (but not out of) repositories by providing a repo_-prefixed repository ID as the parent.

        '
      operationId: updateDocument
      tags:
      - Document Access
      security:
      - OAuth2:
        - lucidchart.document.content
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to update.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDocumentRequestBody'
      responses:
        '200':
          description: OK with Document resource containing information about the updated document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request. * Title must be non-empty when included. * Title must be at most 300 characters. * Title must not start or end with whitespace. * Invalid parent ID. Must be either a string prefixed with repo_ (for repositories) or a number. * Custom tag values must be non-empty when included. * Custom tag values must not start or end with whitespace. * Classification ID must either be null or an existing classification ID.
        '403':
          description: Forbidden. The app making the request does not have permission to the document, or the document does not exist.
        '409':
          description: Conflict. A conflict occurred when saving the document.
  /v1/documents/{id}/trash:
    post:
      summary: Trash Document
      description: 'Moves the specified document to the trash for the requesting user.


        If the document is shared or part of a team folder, other users will still have access to the document. Requires the user to be the owner of the requested document or have the appropriate team folder permissions.

        '
      operationId: trashDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidscale.document.content
        - lucidscale.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to be moved to the trash.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      responses:
        '204':
          description: No Content when the document is successfully moved into the trash or is already trashed.
        '403':
          description: Forbidden. if the app making the request does not have permission to the document, or if the document has been deleted or does not exist.
  /v1/documents/search:
    post:
      summary: Search Documents
      operationId: searchDocuments
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentReadonly
      - OAuth2:
        - lucidchart.document.content:readonly
        - lucidscale.document.content:readonly
        - lucidspark.document.content:readonly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                  description: Array of Lucid Suite products to filter by. Default value assumes all valid products for the given scopes.
                  default:
                  - lucidchart
                  - lucidscale
                  - lucidspark
                createdStartTime:
                  type: string
                  format: date-time
                  default: '0001-01-01T00:00:00Z'
                  description: Date and time to filter documents that have been created after. Default value assumes the beginning of time.
                createdEndTime:
                  type: string
                  format: date-time
                  default: '9999-12-31T23:59:59Z'
                  description: Date and time to filter documents that have been created before. Default value assumes the current instant of time.
                lastModifiedAfter:
                  type: string
                  format: date-time
                  default: '0001-01-01T00:00:00Z'
                  description: Date and time to filter documents that have been modified after. Default value assumes the beginning of time.
                lastModifiedBefore:
                  type: string
                  format: date-time
                  description: Date and time to filter documents that have been modified before. When omitted, results are not bounded by an upper modified-time limit.
                keywords:
                  type: string
                  description: Keywords to search against document content and titles. This field is truncated to 400 characters. When provided, results will be sorted by relevance to keyword search.
                excludeTrashed:
                  type: boolean
                  description: When set to true, excludes trashed/deleted documents from search results. When set to false or omitted, trashed documents are included in results with their trashedTimestamp populated.
                  default: false
                documentLocation:
                  type: string
                  enum:
                  - repositories
                  description: When provided, restricts search results to documents contained within repositories the authenticated user can access. Only the value "repositories" is supported on this endpoint.
                owners:
                  type: array
                  items:
                    type: number
                  description: When provided, limit the search to documents owned by at least one of the specified users. Results are still restricted to documents the authenticated user can access. A maximum of 10000 users may be specified.
                externalAccess:
                  type: string
                  enum:
                  - any
                  - external-collaborators
                  - external-links
                  description: Specify to search for documents with either “any” type of external access, “external-collaborators”, or "external-links"
                statusIds:
                  type: array
                  items:
                    type: number
                  description: List of statusIds to filter by.
                documentIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of documentIds to filter by. A maximum of 10000 documents may be specified.
      responses:
        '200':
          description: OK with an array of Document Resource objects containing information about documents the authenticated user has access to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request if the request does not contain a body.
        '403':
          description: Forbidden if the product query parameter is used and the token's scopes do not contain the matching readonly scope for each product.
        '429':
          description: Too Many Requests if the account makes more than 300 requests in 5 seconds.
  /v1/documents/{id}/contents:
    get:
      summary: Document Contents
      description: 'Retrieves information about the contents of the requested Lucidchart or Lucidspark document.


        Due to the evolving nature of Lucid documents, an unchanged document may produce varying results over time.

        '
      operationId: getDocumentContent
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentReadonly
      - OAuth2:
        - lucidchart.document.content:readonly
        - lucidchart.document.app.picker:readonly
        - lucidchart.document.app.folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to have contents retrieved.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      responses:
        '200':
          description: OK with Document Content resource containing information about the requested document's content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContent'
        '403':
          description: Forbidden if the app making the request does not have permission to the document, or if the document has been deleted or does not exist.
        '429':
          description: Too Many Requests if the account makes more than 100 requests in 5 seconds.
components:
  schemas:
    LucidStandardImportToggleLayerAction:
      type: object
      description: Toggle visibility of layers.
      properties:
        type:
          type: string
          enum:
          - toggleLayer
        layers:
          type: array
          description: List of layer names to toggle.
          items:
            type: string
      required:
      - type
      - layers
    EndpointStyle:
      type: string
      description: The visual style of a line endpoint.
      enum:
      - none
      - aggregation
      - arrow
      - hollowArrow
      - openArrow
      - async1
      - async2
      - closedSquare
      - openSquare
      - bpmnConditional
      - bpmnDefault
      - closedCircle
      - openCircle
      - composition
      - exactlyOne
      - generalization
      - many
      - nesting
      - one
      - oneOrMore
      - zeroOrMore
      - zeroOrOne
      example: arrow
    LucidStandardImportPositionEndpoint:
      type: object
      description: An endpoint at an absolute position on the page.
      properties:
        type:
          type: string
          enum:
          - positionEndpoint
        style:
          $ref: '#/components/schemas/EndpointStyle'
        position:
          $ref: '#/components/schemas/AbsolutePoint'
      required:
      - type
      - style
      - position
    Line:
      type: object
      properties:
        id:
          type: string
          description: Line ID
          example: VTAuwAeC0_R1
        endpoint1:
          $ref: '#/components/schemas/Endpoint'
        endpoint2:
          $ref: '#/components/schemas/Endpoint'
        textAreas:
          type: array
          items:
            $ref: '#/components/schemas/TextArea'
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
      description: Object representing a line on the page of a document. Note that the ItemId of a line is unique across all groups, layers, shapes, and lines.
      required:
      - id
      - endpoint1
      - endpoint2
      - textAreas
      - customData
      - linkedData
    LucidStandardImportCollection:
      type: object
      description: 'A data collection to associate with the document. Exactly one of `dataSource` or `values` must be provided — providing both or neither is an error.

        '
      properties:
        id:
          type: string
          description: Unique identifier for the collection.
      required:
      - id
      oneOf:
      - title: Data source reference
        required:
        - dataSource
        properties:
          dataSource:
            type: string
            description: The data source this collection belongs to.
      - title: Inline values
        required:
        - values
        properties:
          values:
            type: array
            description: 'Inline JSON data for the collection. Each element is an object whose keys become the column headers and whose values become the row data.

              '
            items:
              type: object
              additionalProperties: true
    LucidStandardImportStandardPageSize:
      type: object
      description: A standard named page size.
      properties:
        type:
          type: string
          description: The standard page size name.
          enum:
          - letter
          - legal
          - executive
          - a3
          - a4
          - a5
          - tabloid
          - folio
          - statement
          example: letter
        format:
          type: string
          description: Page orientation.
          enum:
          - landscape
          - portrait
          default: portrait
      required:
      - type
    LucidStandardImportHideLayerAction:
      type: object
      description: Hide layers.
      properties:
        type:
          type: string
          enum:
          - hideLayer
        layers:
          type: array
          description: List of layer names to hide.
          items:
            type: string
      required:
      - type
      - layers
    Group:
      type: object
      properties:
        id:
          type: string
          description: Group ID
          example: VTAu-dl6qtyx
        members:
          type: array
          items:
            type: string
          description: Array of IDs of shapes, lines, & groups contained within the group
          example:
          - VTAuCB8~evzW
          - VTAuo_Y56.q~
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
      description: Object representing a group on the page of a document. Note that the ItemId of a group is unique across all groups, layers, shapes, and lines.
      required:
      - id
      - members
    AbsolutePoint:
      type: object
      description: An absolute point on the page canvas.
      properties:
        x:
          type: number
          description: The x-coordinate. Must be between -1200000 and 1200000, inclusive.
        y:
          type: number
          description: The y-coordinate. Must be between -1200000 and 1200000, inclusive.
      required:
      - x
      - y
    Data:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
          description: Array of collections
      required:
      - collections
      description: Object representing an array of Collections on a document.
    LucidStandardImportUrlAction:
      type: object
      description: Navigate to an external URL.
      properties:
        type:
          type: string
          enum:
          - url
        url:
          type: string
          description: The target URL.
          example: https://example.com
        newWindow:
          type: boolean
          description: Whether to open in a new window.
      required:
      - type
      - url
    LucidStandardImportShowLayerAction:
      type: object
      description: Show layers.
      properties:
        type:
          type: string
          enum:
          - showLayer
        layers:
          type: array
          description: List of layer names to show.
          items:
            type: string
      required:
      - type
      - layers
    LucidStandardImportPageSettings:
      type: object
      description: Page-level settings for a Lucid Standard Import page.
      properties:
        fillColor:
          type: string
          description: Background fill color for the page as a hex color string.
          example: '#ffffff'
        infiniteCanvas:
          type: boolean
          description: Whether the page uses an infinite canvas.
        size:
          $ref: '#/components/schemas/LucidStandardImportPageSize'
        autoTiling:
          type: boolean
          description: Whether auto-tiling is enabled for the page.
        lineJumps:
          type: boolean
          description: 'Whether lines on this page draw small humps where they cross

            other lines. Individual lines may override this with their own

            `lineJumps` setting.

            '
    LucidStandardImportLineEndpoint:
      type: object
      description: An endpoint connected to another line.
      properties:
        type:
          type: string
          enum:
          - lineEndpoint
        style:
          $ref: '#/components/schemas/EndpointStyle'
        lineId:
          type: string
          description: The ID of the line to connect to.
          example: line1
        position:
          type: number
          description: Relative position along the line (0 to 1 inclusive).
          minimum: 0
          maximum: 1
      required:
      - type
      - style
      - lineId
      - position
    LucidStandardImportGroup:
      type: object
      description: A group of items on a page.
      properties:
        id:
          type: string
          description: Unique identifier for the group.
          example: group1
        items:
          type: array
          description: 'List of item IDs (shapes, lines, groups) contained in this group. An item can belong to only one group. If an item ID is specified in multiple groups, it is assigned to the first group encountered, and all subsequent references to that item ID are ignored.

            '
          items:
            type: string
        customData:
          type: array
          description: Custom key-value data to attach to the group.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomDatum'
        linkedData:
          type: array
          description: Links to data collection entries.
          items:
            $ref: '#/components/schemas/LucidStandardImportLinkedDatum'
        note:
          type: string
          description: A note to attach to the group.
        zIndex:
          type: integer
          description: The z-order of the group on the page.
      required:
      - id
    Contains:
      type: object
      properties:
        shapes:
          type: array
          items:
            type: string
          description: Array of IDs of shapes contained within the container
          example:
          - VTAuCB8~evzW
        lines:
          type: array
          items:
            type: string
          description: Array of IDs of lines contained within the container
          example:
          - VTAuo_Y56.q~
        groups:
          type: array
          items:
            type: string
          description: Array of IDs of groups contained within the container
          example:
          - VTAu-dl6qtyx
      required:
      - shapes
      - lines
      - groups
      description: Object listing the IDs of items contained within a container shape (e.g., a frame).
    LucidStandardImportShape:
      type: object
      description: 'A shape definition within a page. The `type` field determines which kind of shape to create.

        Common shape types include `rectangle`, `circle`, `diamond`, `cloud`, `process`, `document`,

        `database`, `hexagon`, `octagon`, `pill`, `roundedRectangle`, `triangle`, `isoscelesTriangle`,

        `stickyNote`, `image`, `table`, `swimLanes`, and many more including BPMN shapes.

        '
      properties:
        id:
          type: string
          description: Unique identifier for the shape within the import. Used to reference this shape from lines and groups.
          example: shape1
        type:
          type: string
          description: The type of shape to create.
          enum:
          - bpmnActivity
          - bpmnBlackBoxPool
          - bpmnChoreography
          - bpmnConversation
          - bpmnDataObject
          - bpmnDataStore
          - bpmnEvent
          - bpmnGateway
          - bpmnGroup
          - bpmnPool
          - bpmnTextAnnotation
          - braceContainer
          - braceNote
          - bracketContainer
          - circle
          - circleContainer
          - cloud
          - connector
          - cross
          - namedContainer
          - namedShape
          - data
          - database
          - decision
          - delay
          - diamond
          - diamondContainer
          - directAccessStorage
          - display
          - document
          - doubleArrow
          - flexiblePolygon
          - freehandBlock
          - freehandDrawing
          - hexagon
          - hotspot
          - image
          - internalStorage
          - isoscelesTriangle
          - lucidCard
          - manualInput
          - manualOperation
          - merge
          - multipleDocuments
          - note
          - octagon
          - offPageLink
          - or
          - paperTape
          - pentagon
          - pillContainer
          - polyStar
          - predefinedProcess
          - preparation
          - process
          - rectangle
          - rectangleContainer
          - rightTriangle
          - roundedRectangleContainer
          - singleArrow
          - sparkCalloutSquare
          - sparkContainer
          - sparkFrame
          - stickyNote
          - storedData
          - summingJunction
          - swimLanes
          - table
          - terminator
          - text
          - umlClass
          example: rectangle
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
        text:
          type: string
          description: Text content to display inside the shape.
          example: Hello World
        opacity:
          type: integer
          description: Opacity of the shape, from 0 (fully transparent) to 100 (fully opaque).
          minimum: 0
          maximum: 100
        note:
          type: string
          description: A note to attach to the shape.
        zIndex:
          type: integer
          description: The z-order of the shape on the page.
        customData:
          type: array
          description: Custom key-value data to attach to the shape.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomDatum'
        style:
          $ref: '#/components/schemas/LucidStandardImportStyle'
        actions:
          type: array
          description: Interactive actions attached to the shape (e.g., navigate to a URL or page).
          items:
            $ref: '#/components/schemas/LucidStandardImportAction'
        linkedData:
          type: array
          description: Links to data collection entries.
          items:
            $ref: '#/components/schemas/LucidStandardImportLinkedDatum'
      required:
      - id
      - type
      - boundingBox
    Product:
      type: string
      enum:
      - lucidchart
      - lucidscale
      - lucidspark
      description: The Lucid Suite product that a document was created in.
      example: lucidchart
    LucidStandardImportGotoDocumentAction:
      type: object
      description: Navigate to a page in another document.
      properties:
        type:
          type: string
          enum:
          - gotoDocument
        documentId:
          type: string
          description: The ID of the target document.
        pageId:
          type: string
          description: The ID of the target page within the document.
        newWindow:
          type: boolean
          description: Whether to open in a new window.
      required:
      - type
      - documentId
      - pageId
    LucidStandardImportColorFill:
      type: object
      description: A solid color fill.
      properties:
        type:
          type: string
          enum:
          - color
        color:
          type: string
          description: Fill color as a hex color string.
          example: '#ffffff'
      required:
      - type
      - color
    LucidStandardImportStyle:
      type: object
      description: Visual style properties for a shape.
      properties:
        fill:
          $ref: '#/components/schemas/LucidStandardImportFill'
        stroke:
          $ref: '#/components/schemas/LucidStandardImportStroke'
        rounding:
          type: number
          description: Corner rounding radius for the shape. Must be between 0 and 720, inclusive.
          default: 6
          minimum: 0
          maximum: 720
        textColor:
          type: string
          description: Text color as a hex color string.
          example: '#000000'
    LucidStandardImportStroke:
      type: object
      description: Stroke styling for a line.
      properties:
        color:
          type: string
          description: Hex color string for the stroke.
          default: '#000000'
          example: '#000000'
        width:
          type: number
          description: Stroke thickness. Must be between 0 and 10, inclusive.
          default: 2
          minimum: 0
          maximum: 10
          example: 2
        style:
          type: string
          description: The stroke dash style.
          enum:
          - solid
          - dotted
          - dashed
          default: solid
          example: solid
    Page:
      type: object
      properties:
        id:
          type: string
          description: Page ID
          example: YGcM5DNywbTK
        title:
          type: string
          description: Title of the page
          example: document page title
        index:
          type: integer
          description: 0-Based index of the page in the document
          example: 0
        items:
          $ref: '#/components/schemas/Items'
          description: Shapes, Lines, Groups, and Layers on the page
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
          description: Array of Data Pair resources linked to the page
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
          description: Array of Linked Data resources linked to the page
      description: Object representing a single page of a Lucidchart document.
      required:
      - id
      - title
      - index
      - items
      - customData
      - linkedData
      example:
        id: YGcM5DNywbTK
        title: document page title
        index: 0
        items:
          shapes: []
          lines: []
          groups: []
          layers: []
        customData: []
        linkedData: []
    LucidStandardImportContent:
      type: object
      description: 'Defines the content of a document using the Lucid Standard Import format, including pages, shapes, and lines.

        Mutually exclusive with `extensionBootstrapData`.

        '
      properties:
        version:
          type: integer
          description: The version of the Lucid Standard Import format.
          enum:
          - 1
          example: 1
        pages:
          type: array
          description: List of pages to create in the document. At least one page is required.
          minItems: 1
          items:
            $ref: '#/components/schemas/LucidStandardImportPage'
        collections:
          type: array
          description: List of data collections to associate with the document.
          items:
            $ref: '#/components/schemas/LucidStandardImportCollection'
        documentSettings:
          $ref: '#/components/schemas/LucidStandardImportDocumentSettings'
      required:
      - version
      - pages
    LucidStandardImportLine:
      type: object
      description: A line definition within a page.
      properties:
        id:
          type: string
          description: Unique identifier for the line within the import.
          example: line1
        lineType:
          type: string
          description: The type of line routing.
          enum:
          - straight
          - elbow
          - curved
          example: elbow
        stroke:
          $ref: '#/components/schemas/LucidStandardImportStroke'
        endpoint1:
          $ref: '#/components/schemas/LucidStandardImportEndpoint'
        endpoint2:
          $ref: '#/components/schemas/LucidStandardImportEndpoint'
        text:
          type: array
          description: Text labels to display along the line.
          items:
            $ref: '#/components/schemas/LucidStandardImportLineText'
        customData:
          type: array
          description: Custom key-value data to attach to the line.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomDatum'
        linkedData:
          type: array
          description: Links to data collection entries.
          items:
            $ref: '#/components/schemas/LucidStandardImportLinkedDatum'
        joints:
          type: array
          description: Control points for straight lines.
          items:
            $ref: '#/components/schemas/AbsolutePoint'
        elbowControlPoints:
          type: array
          description: Control points for elbow lines.
          items:
            $ref: '#/components/schemas/AbsolutePoint'
        cornerRadius:
          type: number
          description: Corner radius for elbow line bends.
        zIndex:
          type: integer
          description: The z-order of the line on the page.
        lineJumps:
          type: boolean
          description: 'Whether this line draws a small hump where it crosses other lines.

            When set, overrides the page-level `lineJumps` setting for this

            line only.

            '
      required:
      - id
      - lineType
      - endpoint1
      - endpoint2
    PatchDocumentRequestBody:
      type: object
      description: Request body for updating a document. At least one field should be provided.
      properties:
        title:
          type: string
          description: New title for the document. Must be non-empty, at most 300 characters, and must not start or end with whitespace.
          example: My Updated Document
        parent:
          description: 'ID of the folder or repository to move the document into. Set to null to move the document to the root folder.

            For repositories, use the repository ID prefixed with `repo_` (e.g., `repo_12345`). For folders, use the numeric folder ID.

            '
          oneOf:
          - type: integer
            description: Numeric folder ID.
          - type: string
            description: Repository ID prefixed with `repo_`.
          example: 12345
        customTags:
          type: array
          items:
            type: string
          description: List of custom tags to assign to the document. Including this field overwrites all existing tags on the document with the provided values. Each tag must be non-empty and must not start or end with whitespace. Omitting this field leaves existing tags unchanged; set to an empty array to clear all tags.
          example:
          - in progress
        classificationId:
          type:
          - string
          - 'null'
          format: uuid
          description: ID of the classification to assign to the document. Omitting this field leaves the existing classification unchanged; set to null to remove the classification.
          example: 1cdad938-bf0f-4a0c-a2f8-bf4eb94225ce
    Document:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
          description: Unique ID of the document
          example: 110808fd-4553-4316-bccf-4f25ff59a532
        title:
          type: string
          description: Title of the document
          example: document title
        editUrl:
          type: string
          format: uri
          description: Link to edit the document
          example: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/edit
        viewUrl:
          type: string
          format: uri
          description: Link to view the document
          example: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/view
        version:
          type: integer
          description: Most recent version
          example: 101
        pageCount:
          type: integer
          description: Number of pages within the document
          example: 5
        canEdit:
          type: boolean
          description: If requesting user can edit the document
          example: false
        created:
          type: string
          format: date-time
          description: Date and time of when the document was created
          example: '2019-04-22T13:47:23Z'
        creatorId:
          type: integer
          description: ID of user who created and owns the document
          example: 12345
        lastModified:
          type: string
          format: date-time
          description: Date and time of when the document was last modified
          example: '2020-06-26T16:29:37Z'
        lastModifiedUserId:
          type: integer
          description: ID of user who most recently modified the document
          example: 54321
        customAttributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: List of any custom attributes belonging to the document. Populated for Enterprise Accounts only.
          example: []
        customTags:
          type: array
          items:
            type: string
          description: List of any custom tags assigned to the document
          example:
          - in progress
        product:
          $ref: '#/components/schemas/Product'
        status:
          type:
          - string
          - 'null'
          description: Current assigned status of the document
          example: Complete
        classification:
          type:
          - string
          - 'null'
          description: Current assigned classification of the document
          example: Private
        classificationId:
          type:
          - string
          - 'null'
          format: uuid
          description: Current assigned classification ID of the document.
          example: b7db4f07-5225-4a0c-8313-0fe199eec844
        trashed:
          type:
          - string
          - 'null'
          format: date-time
          description: If defined, the timestamp when the document was moved to the trash
          example: null
        parent:
          type:
          - integer
          - 'null'
          description: ID of the parent folder
          example: null
        repository:
          allOf:
          - $ref: '#/components/schemas/Repository'
        accountId:
          type:
          - integer
          - 'null'
          description: ID of Lucid account that owns the document
        owner:
          $ref: '#/components/schemas/DocumentOwner'
      required:
      - documentId
      - title
      - editUrl
      - viewUrl
      - version
      - pageCount
      - canEdit
      - created
      - creatorId
      - lastModified
      - lastModifiedUserId
      - customAttributes
      - customTags
      - product
      - accountId
      example:
        documentId: 110808fd-4553-4316-bccf-4f25ff59a532
        title: document title
        editUrl: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/edit
