                    example: https://data.lucid.app/collections/2/schema/4
                  name:
                    type: string
                    description: Name of the field
                    example: Co1B
                  fieldType:
                    type: string
                    description: Stores the type of the field. The type does not affect how the data is
                      interpreted in the Data Service; it is for use on the client side. Valid values
                      include `BOOLEAN`, `STRING`, `NUMBER`, and `ANY`.
                    example: STRING
                  collection:
                    type: string
                    description: Link to the associated collection
                    example: https://data.lucid.app/collections/2
