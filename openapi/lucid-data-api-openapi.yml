  /collections:
    head:
      summary: Get Total Collections Count
      description: 'This endpoint returns the number of collections a user has access to. The return value
        is in the response headers as Lucid-Collections-Total.

        '
      operationId: getTotalCollectionsCount
      tags:
      - Collection
      security:
      - OAuth2:
        - data-service.admin
      responses:
        '200':
          description: OK with `lucid-collections-total` header in response
          headers:
            lucid-collections-total:
              schema:
                type: integer
                example: 123
    get:
      summary: Get All Collections
      description: 'This endpoint returns all collections that the user has access to. The results will
        be paginated. If the number of collections exceeds the pagination limit, links will be provided
        to get the next set of results or the previous set of results (if applicable). The range of returned
        values can be determined by optional start and end parameters. If the difference between the end
        and start values is greater than the pagination limit, the endpoint returns collections in the
        range from start to start + pagination limit. Items in the response are determined based on their
        creation order.

        '
      operationId: getAllCollections
      tags:
      - Collection
      security:
      - OAuth2:
        - data-service.admin
      parameters:
      - name: start
        in: query
        description: Starting 1-based index of collections to retreive. Defaults to 1.
        required: false
        schema:
          type: integer
      - name: end
        in: query
        description: Ending index of collections to retreive. Defaults to 1000.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK with paginated list of Collections
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        uri:
                          type: string
                          description: URI of the collection
                          example: https://data.lucid.app/collections/3
                        dataSource:
                          type: string
                          description: Link to get parent data source
                          example: https://data.lucid.app/dataSources/1
                        name:
                          type: string
                          description: Name of the collection
                          example: Collection 1
                        lastSync:
                          type: string
                          description: Date the collection was last synced with upstream source
                          example: '2021-01-01T00:00:00Z'
                        versionTimestamp:
                          type: string
                          description: Timestamp of the last time the collection, the collection's schema,
                            the collection's contents, one of its collection properties, or anything in
                            any of its metadata collections was changed. It can be used to tell if a copy
                            of the data is out of date and needs to be refreshed.
                          example: '2021-01-01T00:00:00Z'
                        created:
                          type: string
                          description: Date the collection was created
                          example: '2021-01-01T00:00:00Z'
                        lastModified:
                          type: string
                          description: Date the collection was last modified
                          example: '2021-01-01T00:00:00Z'
                        items:
                          type: string
