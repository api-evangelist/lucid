  /adapter/csv:
    post:
      summary: Create Data Source from CSV
      description: 'If able to successfully parse the attached file as a CSV file, a new data source with
        be created (with the same name as the attached file) that includes a single collection. The single
        collection in the newly created data source will contain the data from the CSV file. Each row
        will be an item, and each column will be labelled A, B, C, …, AA, AB, AC, .. in the order in which
        they were in the original file. There will be a single metadata collection created which represents
        the mapping between the id of each created item and the original row number of the row it was
        created from.

        '
      operationId: createDataSourceFromCSV
      tags:
      - Data Source
      security:
      - OAuth2:
        - data-service.admin
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file to upload
              required:
              - file
              example:
                file: file=@location/file.csv
      responses:
        '200':
          description: OK with Data Source
          content:
            application/json:
              schema:
                type: object
                properties:
                  uri:
                    type: string
                    description: URI of the data source
                    example: https://data.lucid.app/dataSources/2967
                  name:
                    type: string
                    description: Name of the data source
                    example: file
                  sourceGrants:
                    type: string
                    description: Link to get grants for the data source
                    example: https://data.lucid.app/sourceGrants?dataSource=https://data.lucid.app/dataSources/2967
                  adapterType:
                    type: string
                    description: Type of adapter used to create the data source. Valid values are `CSV`,
                      `DATA_API`, and `UNKNOWN`
                    example: CSV
                  collections:
                    type: string
                    description: Link to get collections for the data source
                    example: https://data.lucid.app/collections?dataSource=https://data.lucid.app/dataSources/2967
                  created:
                    type: string
                    description: Date the data source was created
                    example: '2021-01-01T00:00:00Z'
                  lastModified:
                    type: string
                    description: Date the data source was last modified
                    example: '2021-01-01T00:00:00Z'
                  pending:
                    type: boolean
                    description: If a data source is marked pending it won't be availble for users to
                      select within Lucid
                    example: false
                  dataSet:
                    type: string
                    description: Link to get the data set for the data source
                    example: https://data.lucid.app/dataSets/2168
                  linkParameters:
                    type: object
                    description: Link parameters for the data source
                    example:
                      param1: value1
                      param2: value2
                  deleted:
                    type: string
                    description: Date the data source was deleted
                    example: '2021-01-01T00:00:00Z'
                required:
                - uri
                - name
                - sourceGrants
                - adapterType
                - collections
                - created
                - lastModified
                - pending
                - dataSet
                example:
                  uri: https://data.lucid.app/dataSources/2967
