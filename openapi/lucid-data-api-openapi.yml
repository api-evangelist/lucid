                  linkParameters:
                    param1: value1
                    param2: value2
                  deleted: '2021-01-01T00:00:00Z'
        '400':
          description: Bad Request if no file provided or unable to read file
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
