      operationId: updateGoogleCloudDataSource
      tags:
      - Cloud
      security:
      - ApiKey:
        - CloudEdit
      - OAuth2:
        - cloud.datasource
      parameters:
      - name: googleCloudDataSourceId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/GoogleCloudDataSourceId'
        description: The ID of the Google Cloud data source to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoogleCloudDataSourceRequest'
      responses:
        '202':
          description: Accepted. Occurs when the update job has been queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobReferenceIdResponse'
        '400':
          description: Bad Request. Occurs when the data source ID is malformatted.
        '403':
          description: Forbidden. Occurs when the data source does not exist or the user does not have access to it.
        '409':
          description: Conflict. Occurs when an update job is already in progress for this data source.
    patch:
      summary: Edit Google Cloud Data Source
      description: Edit the metadata of a Google Cloud data source. Metadata refers to any property of the data source that is not related to the data source's cloud data itself.
      operationId: editGoogleCloudDataSource
