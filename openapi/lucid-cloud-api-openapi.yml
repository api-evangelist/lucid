components:
  schemas:
    AwsDataSourceId:
      type: string
      description: AWS data source ID
      pattern: ^awsds_[0-9]+$
      example: awsds_12345
    AzureDataSourceObject:
      type: object
      properties:
        dataSourceId:
          $ref: '#/components/schemas/AzureDataSourceId'
        type:
          type: string
          enum:
          - azure
        params:
          type: object
          properties:
            name:
              type: string
              example: Example Azure Data Source
            importType:
              type: string
              enum:
              - adApp
              - cliJson
              example: adApp
            subscriptionId:
              type: string
              description: The ID of the linked Azure subscription (only for adApp import types)
              example:
              - a1b2c3d4-e5f6-7890-abcd-ef1234567890
            resourceSelection:
              type: array
              items:
                type: string
              description: List of Azure resources included in the data source (only for adApp import types)
              example:
              - Microsoft.Compute/virtualMachines
          required:
          - name
          - importType
      required:
      - dataSourceId
      - type
      - params
    JobReferenceIdResponse:
      type: object
      properties:
        jobId:
          $ref: '#/components/schemas/JobReferenceId'
      required:
      - jobId
    UpdateAwsCredentialRequest:
      type: object
      properties:
        arn:
          type: string
          description: When provided, the AWS resource identifier with which the trust relationship was formed via the externalId
          example: arn:aws:iam::123456789012:role/LucidCloudRole
        name:
          type: string
          description: When provided, the name to give the credential
          example: Example AWS Credential - Updated
        orgMemberAccountRoleName:
          type: string
          description: When provided, the IAM role that exists in each of your AWS member accounts to be included by Lucid when making requests on your behalf
          example: OrganizationAccountAccessRole
    DataSourceObject:
      oneOf:
      - $ref: '#/components/schemas/AwsDataSourceObject'
      - $ref: '#/components/schemas/AzureDataSourceObject'
      - $ref: '#/components/schemas/GoogleCloudDataSourceObject'
      discriminator:
        propertyName: type
        mapping:
          aws: '#/AwsDataSourceObject'
          azure: '#/AzureDataSourceObject'
          googleCloud: '#/GoogleCloudDataSourceObject'
    EditAwsDataSourceRequest:
      type: object
      properties:
        name:
          type: string
          description: The new display name to give to the AWS data source
          example: Example AWS Data Source - Updated
    AwsCredentialObject:
      type: object
      properties:
        credentialId:
          $ref: '#/components/schemas/AwsCredentialId'
        type:
          type: string
          enum:
          - aws
        params:
          type: object
          properties:
            name:
              type: string
              description: Name of the credential
              example: Example AWS Credential
            arn:
              type: string
              description: The AWS resource identifier corresponding to the credential
              example: arn:aws:iam::123456789012:role/lucidimport
            orgMemberAccountRoleName:
              type: string
              description: If not null, then the IAM role that exists in each of your AWS member accounts that was included by Lucid when making requests on your behalf to create or update the credential
              example: LucidCloudMemberAccountRole
          required:
          - name
          - arn
          - orgMemberAccountRoleName
      required:
      - credentialId
      - type
      - params
    AwsDataSourceJobStatusResponse:
