    RepositoryId:
      type: string
      description: Unique identifier for a repository folder, prefixed with `repo_`
      example: repo_1234321
    RepositoryAccessType:
      type: string
      enum:
      - UNRESTRICTED
      - RESTRICTED
      description: Determines repository visibility. UNRESTRICTED repositories are visible to all users
        on the account, RESTRICTED are visible to specific authorized groups and individuals.
      example: UNRESTRICTED
    RepositoryObject:
      type: object
      properties:
        repositoryId:
          $ref: '#/components/schemas/RepositoryId'
        name:
          type: string
          description: Display name of the repository
          example: My Business Process Repository
        accessType:
          $ref: '#/components/schemas/RepositoryAccessType'
        created:
          type: string
          format: date-time
          description: The date and time the repository was created
          example: '2022-11-11T21:48:35.293Z'
    RepositoryRole:
      type: string
      enum:
      - REPOSITORY_OWNER
      - REPOSITORY_MEMBER
      description: Role of a user on a repository
      example: REPOSITORY_OWNER
    CreateRepositoryRequest:
      type: object
      properties:
        name:
          type: string
          description: Display name for the repository
          example: Example Process Repository
        accessType:
          $ref: '#/components/schemas/RepositoryAccessType'
          description: Optional. Determines repository visibility. Defaults to UNRESTRICTED.
        users:
          type: array
          items:
            $ref: '#/components/schemas/AddRepositoryUserRequest'
          description: List of users to add to the repository. Must contain at least one owner.
        groups:
          type: array
          items:
            type: integer
          description: Optional. Group Ids of groups whose members should have access to this repository.
            Only applicable to RESTRICTED repositories.
          example:
          - 123456
          - 789123
      required:
      - name
      - users
    AddRepositoryUserRequest:
      type: object
      properties:
        userId:
          type: integer
          description: Unique identifier of the user to add or update
          example: 1234567
        role:
          $ref: '#/components/schemas/RepositoryRole'
      required:
      - userId
      - role
    RepositoryUser:
      type: object
      properties:
        repositoryId:
          type: string
          description: Unique identifier of the repository
          example: repo_2000719
        userId:
          type: integer
          description: Unique identifier of the user
          example: 1234567
        role:
          $ref: '#/components/schemas/RepositoryRole'
        created:
          type: string
          format: date-time
          description: Date and time when the user was added to the repository
          example: '2026-01-21T01:10:41Z'
    AddRepositoryUsersRequest:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AddRepositoryUserRequest'
          description: Array of users and their roles to add or update on the repository
      required:
      - users
    RepositoryGroupCollaborator:
      type: object
      properties:
        repositoryId:
          type: string
          description: Unique identifier of the repository
          example: repo_987654
        groupId:
          type: integer
          description: Unique identifier of the group
          example: 123456
    RepositoryGroupsRequest:
      type: object
      properties:
        groups:
          type: array
          items:
            type: integer
          description: Array of group IDs.
          example:
          - 123456
          - 789123
      required:
      - groups
    DocumentThread:
      type: object
      description: A comment thread on a document.
      properties:
        threadId:
          type: string
          description: The unique ID of the comment thread.
          example: abc123
        created:
          type: string
          format: date-time
          description: The date and time when the thread was created.
          example: '2024-01-01T00:00:00Z'
        status:
          $ref: '#/components/schemas/ThreadStatus'
      required:
      - threadId
      - created
      - status
    ThreadStatus:
      type: string
      enum:
      - OPEN
      - CLOSED
      description: The status of a comment thread. OPEN indicates an unresolved thread, CLOSED indicates
        a resolved thread.
    DocumentComment:
      type: object
      description: A comment within a comment thread on a document.
      properties:
        threadId:
          type: string
          description: The ID of the thread this comment belongs to.
          example: abc123
        userId:
          type: integer
          description: The ID of the user who posted the comment.
        comment:
          type: string
          description: The text content of the comment.
          example: This is a comment
        created:
          type: string
          format: date-time
          description: The date and time when the comment was created.
          example: '2024-01-01T00:00:00Z'
        assignees:
          type: array
          nullable: true
          items:
            type: integer
          description: List of user IDs assigned to this comment, or null if no users are assigned.
      required:
      - threadId
      - userId
      - comment
      - created
    PostCommentRequestBody:
      type: object
      description: Request body for posting a comment to a thread.
      properties:
        comment:
          type: string
          description: The text content of the comment. Must be non-empty and at most 10,000 characters.
          example: This is a comment
      required:
      - comment
    Subscription:
      type: object
      description: A subscription resource representing a Lucid product subscription
      properties:
        id:
          type: string
          format: uuid
          description: Subscription ID
          example: 8e8cf611-d74c-4a2f-8b61-754b22328fbb
        licenseTotal:
          type: integer
          description: 'Total number of available licenses on the subscription and its addons.

            If there are unlimited licenses, this field will not be returned.

            '
          example: 100
        licensesUsed:
          type: integer
          description: Number of licenses currently assigned to users on the subscription
          example: 50
        trial:
          type: boolean
          description: Whether this is a trial subscription
          example: false
        start:
          type: string
          format: date-time
          description: Date and time when subscription started
          example: '2024-08-08T22:21:48.612Z'
        end:
          type: string
          format: date-time
          description: Date and time when subscription ends
          example: '2024-08-08T22:21:48.612Z'
        renewal:
          type: string
          format: date-time
          description: Date and time when subscription renewal happens
          example: '2024-08-08T22:21:48.612Z'
      required:
      - id
      - licensesUsed
      - trial
      - start
      - end
      - renewal
    License:
      type: object
      description: A license resource representing a user's license on a subscription
      properties:
        userId:
          type: integer
          description: User ID
          example: 123
        subscriptionId:
          type: string
          format: uuid
          description: Subscription ID
          example: 8e8cf611-d74c-4a2f-8b61-754b22328fbb
        created:
          type: string
          format: date-time
          description: Date and time when the license was granted
          example: '2024-08-08T22:21:48.612Z'
      required:
      - userId
      - subscriptionId
      - created
    GrantLicenseRequest:
      type: object
      description: Request body for granting a license to a user
      properties:
        subscriptionId:
          type: string
          format: uuid
          description: The subscription ID to grant the license from
          example: 8e8cf611-d74c-4a2f-8b61-754b22328fbb
      required:
      - subscriptionId
