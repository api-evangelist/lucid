        >

        > For examples of how to use the Standard Import, refer to the `/standard-import` folder in Lucid''s
        repository of [Sample Lucid REST Applications](https://github.com/lucidsoftware/sample-lucid-rest-applications/tree/main/standard-import).
        This repo also contains some example `.zip` Standard Import files you can reference or use in
        your own projects.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidchart.document.app.folder`

        - `lucidspark.document.content`

        - `lucidspark.document.app.folder`

        '
      operationId: createDocumentWithStandardImport
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - type
              - product
              properties:
                file:
                  type: string
                  format: binary
                  description: The Lucid Standard Import specification (`.zip` archive) from which to
                    create the document.
                type:
                  type: string
                  enum:
                  - x-application/vnd.lucid.standardImport
                product:
                  $ref: '#/components/schemas/CreatableProduct'
                title:
                  type: string
                  description: Title that should be given to the newly created document. If no title is
                    specified, the document will be automatically assigned the file name.
                parent:
                  type: number
                  description: Folder ID for the new document.
      responses:
        '201':
          description: 'Created with Document resource containing information about the newly created
            document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: 'Bad Request.

            * Invalid request body — the provided payload does not conform to the Lucid Standard Import
            schema.

            '
        '403':
          description: 'Forbidden.

            * if the user doesn''t have access to or permissions to create within the specified parent
            folder.

            * if the token authorizing the request has the document.app scope with a specified parent
            folder that is outside the app folder''s folder tree.

            * if the token does not have the correct scope for the import type.

            '
        '415':
          description: Unsupported Media Type. The file type provided is not supported.
  /v1/documents/import:
    post:
      summary: Import Document
      description: 'Imports an external non-Lucid file as a new document within Lucid. The file is uploaded
        as multipart/form-data. Requires `file`, `type`, and `product`. Optionally, a `title` and `parent`
        folder can be provided. If no `title` is provided, the new document''s title will be the imported
        filename.


        > 📘

        >

        > This endpoint can only create a new Lucidchart or Lucidspark document. It cannot modify an existing
        document''s contents.


        > 📘 ##### Document Creation Location

        >

        > When there is no `parent` field on the request, the new document will be created in a default
        location depending on the authorizing token''s scopes.

        >

        > - If the token authorizing the request uses one of the `document.app` scopes, then the document
        will be created in an `app-specific folder`.

        > - If one of the `document.content` scopes is used, the document will be created in the user''s
        ''My Documents folder''.

        > - If both types of scopes are authorized on the token, the `document.content` behavior will
        take priority and the document will be created in the user''s ''My Documents'' folder.


        > 📘 Board import

        >

        > - The `board` import type only accepts pdfs that are exports of digital whiteboards.

        > - The `board` import type can only be authorized by users with a Lucidspark Enterprise license.

        > - The `board` import type is experimental and importing the same board may produce varying results
        over time.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidchart.document.app.folder`

        - `lucidspark.document.content`

        - `lucidspark.document.app.folder`

        '
      operationId: importDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - type
              - product
              properties:
                file:
                  type: string
                  format: binary
                  description: The file from which to import the document.
                type:
                  type: string
                  enum:
                  - x-application/vnd.lucid.drawio
                  - x-application/vnd.lucid.visio
                  - x-application/vnd.lucid.gliffy
                  - x-application/vnd.lucid.board
                  description: 'The type of file provided for import. Supported types:

                    * `x-application/vnd.lucid.drawio` — draw.io files (.drawio, .xml) for Lucidchart

                    * `x-application/vnd.lucid.visio` — Visio files (.vsdx, .vdx) for Lucidchart

                    * `x-application/vnd.lucid.gliffy` — Gliffy files (.gliffy, .gon, .gxml) for Lucidchart

                    * `x-application/vnd.lucid.board` — Board files (.pdf) for Lucidspark

                    '
                product:
                  $ref: '#/components/schemas/CreatableProduct'
                title:
                  type: string
                  description: Title that should be given to the newly imported document. If no title
                    is specified, the document will be automatically assigned the file name.
                parent:
                  type: number
                  description: Folder ID for the new document.
      responses:
        '201':
          description: 'Created with Document resource containing information about the newly imported
            document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          description: 'Forbidden.

            * if the user doesn''t have access to or permissions to create within the specified parent
            folder.

            * if the token authorizing the request has the document.app scope with a specified parent
            folder that is outside the app folder''s folder tree.

            * if the token does not have the correct scope for the import type.

            * if the token requesting a board import does not have a Lucidspark Enterprise License.

            '
        '415':
          description: Unsupported Media Type. The file type provided is not supported.
  /v1/documents/copy:
    post:
      summary: Copy Document
      description: 'Copies one of the requesting user''s existing documents, with the specified title.
        Requires `title` and `template` (the ID of the document to copy). Optionally, a `parent` folder
        can be provided. Note that collaborator permissions are not transferred to the copied document.


        > 📘

        >

        > This endpoint can only create a new Lucidchart or Lucidspark document. It cannot modify an existing
        document''s contents.


        > 📘 ##### Document Creation Location

        >

        > When there is no `parent` field on the request, the new document will be created in a default
        location depending on the authorizing token''s scopes.

        >

        > - If the token authorizing the request uses one of the `document.app` scopes, then the document
        will be created in an `app-specific folder`.

        > - If one of the `document.content` scopes is used, the document will be created in the user''s
        ''My Documents folder''.

        > - If both types of scopes are authorized on the token, the `document.content` behavior will
        take priority and the document will be created in the user''s ''My Documents'' folder.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidchart.document.app.folder`

        - `lucidspark.document.content`

        - `lucidspark.document.app.folder`

        '
      operationId: copyDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - template
              properties:
                title:
                  type: string
                  description: Title that should be given to the copied document.
                template:
                  type: string
                  format: uuid
                  description: ID of the document to copy.
                parent:
                  type: number
                  description: Folder ID for the new document.
      responses:
        '201':
          description: 'Created with Document resource containing information about the newly copied document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          description: 'Forbidden.

            * if the user doesn''t have access to or permissions to create within the specified parent
            folder.

            * if the user doesn''t have permissions to access the specified template to copy from.

            * if the token authorizing the request has the document.app scope with a specified parent
            folder that is outside the app folder''s folder tree.

            '
  /v1/documents/{id}:
    get:
      summary: Get/Export Document
      description: 'Retrieves information about the requested document or exports it as an image.


        **Get Document:** Requires at least read-only access. Document owner information is only returned
        if the requesting user has view access and the document is unpublished. If published, the user
        must be at least a collaborator.


        **Export Document:** Exports a given document in a specified image format. When exporting oversized
        images, the resolution may be automatically scaled down to enable performant API requests.


        **Admin flow:** Account owners and document admins can access any document belonging to their
        account without needing a direct share by setting the `Lucid-Request-As: admin` header and authenticating
        with an admin scope or `DocumentAdmin` API key grant.

        '
      operationId: getOrExportDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentReadonly
        - DocumentAdmin
      - OAuth2:
        - lucidchart.document.content:readonly
        - lucidchart.document.content:admin.readonly
        - lucidchart.document.app.picker:readonly
        - lucidchart.document.app.folder
        - lucidscale.document.content:readonly
        - lucidscale.document.content:admin.readonly
        - lucidscale.document.app.picker:readonly
        - lucidscale.document.app.folder
        - lucidspark.document.content:readonly
        - lucidspark.document.content:admin.readonly
        - lucidspark.document.app.picker:readonly
        - lucidspark.document.app.folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to be retrieved or exported.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      - name: Lucid-Request-As
        in: header
        required: false
        description: 'If the requesting user is an account owner or document admin with the required permissions
          and they make the

          request with the value of "admin" as this header and include an admin scope or `DocumentAdmin`
          API key grant,

          the request will be made using their admin permissions and will succeed for any document belonging
          to their

          account.

          '
        schema:
          type: string
        example: admin
      - name: Accept
        in: header
        description: "When using the Export Document API, the format of the exported document is set via\
          \ the `Accept` header. This header contains up to two parts, separated by a semicolon:\n  *\
          \ A prefix stating which type of image you would like the document exported as. Options are:\n\
          \    * `image/jpeg`\n    * `image/png`\n  * Optionally, you can also supply the dots per inch\
          \ (DPI) you want the exported image to have. If this value is not provided, a default of 160\
          \ will be used. For example:\n    * `image/png;dpi=256`\n    * `image/jpeg;dpi=64`"
        required: false
        schema:
          type: string
          example: image/png
      - name: page
        in: query
        description: 1-based page index of the document to export. Defaults to the first page. Only a
          single page is allowed. Optional for export operation. Cannot be provided when pageId is provided.
        required: false
        schema:
          type: number
          default: 1
      - name: pageId
        in: query
        description: Specific page of the document to export. Only a single page is allowed. Optional
          for export operation. Cannot be provided when page is provided.
        example: J~65X_X714o2
        required: false
        schema:
          type: string
      - name: crop
        in: query
        description: "Specifies the crop settings for the document export. Optional for export operation.\
          \ Possible values are\n  * Default (no crop parameter) - Exports the entire page canvas area\
          \ that contains your content. Automatically adjusts to include all items on the page, including\
          \ the space between them and maintains the relative positioning and spacing of your document\
          \ elements\n  * `x, y, width, height` - Crop to the specified region (in pixels) on the page.\
          \ Example crop=1000,300,30,7\n    * Note: The region (in pixels) is accurate to the number of\
          \ pixels on the canvas. The number of pixels of the outputted image will only match the crop\
          \ window at a DPI of 160.\n  * `content` - Crop to page content. Example crop=content"
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK with Document resource containing information about the requested document or
            the binary data in the response body for exports. The Accept header specifies the type of
            image for exports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request. More than one page and/or pageId was provided for export.
        '403':
          description: Forbidden. The app making the request does not have permission to the document,
            or if the document has been deleted or does not exist.
        '404':
          description: Not Found. The specified page or pageID could not be found for export.
        '406':
          description: Not Acceptable. The specified image type is not supported for export.
        '429':
          description: Too Many Requests. If the account makes more than 75 requests in 5 seconds.
    patch:
      summary: Update Document
      description: 'Updates properties of an existing document. Supports partial updates via JSON for
        title, parent, and classification.


        Supports moving documents into (but not out of) repositories by providing a repo_-prefixed repository
        ID as the parent.

        '
      operationId: updateDocument
      tags:
      - Document Access
      security:
      - OAuth2:
        - lucidchart.document.content
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to update.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDocumentRequestBody'
      responses:
        '200':
          description: OK with Document resource containing information about the updated document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request. * Title must be non-empty when included. * Title must be at most 300
            characters. * Title must not start or end with whitespace. * Invalid parent ID. Must be either
            a string prefixed with repo_ (for repositories) or a number. * Custom tag values must be non-empty
            when included. * Custom tag values must not start or end with whitespace. * Classification
            ID must either be null or an existing classification ID.
        '403':
          description: Forbidden. The app making the request does not have permission to the document,
            or the document does not exist.
        '409':
          description: Conflict. A conflict occurred when saving the document.
  /v1/documents/{id}/trash:
    post:
      summary: Trash Document
      description: 'Moves the specified document to the trash for the requesting user.


        If the document is shared or part of a team folder, other users will still have access to the
        document. Requires the user to be the owner of the requested document or have the appropriate
        team folder permissions.

        '
      operationId: trashDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidscale.document.content
        - lucidscale.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to be moved to the trash.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      responses:
        '204':
          description: No Content when the document is successfully moved into the trash or is already
            trashed.
        '403':
          description: Forbidden. if the app making the request does not have permission to the document,
            or if the document has been deleted or does not exist.
  /v1/documents/search:
    post:
      summary: Search Documents
      operationId: searchDocuments
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentReadonly
      - OAuth2:
        - lucidchart.document.content:readonly
        - lucidscale.document.content:readonly
        - lucidspark.document.content:readonly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: array
                  items:
                    $ref: '#/components/schemas/Product'
                  description: Array of Lucid Suite products to filter by. Default value assumes all valid
                    products for the given scopes.
                  default:
                  - lucidchart
                  - lucidscale
                  - lucidspark
                createdStartTime:
                  type: string
                  format: date-time
                  default: '0001-01-01T00:00:00Z'
                  description: Date and time to filter documents that have been created after. Default
                    value assumes the beginning of time.
                createdEndTime:
                  type: string
                  format: date-time
                  default: '9999-12-31T23:59:59Z'
                  description: Date and time to filter documents that have been created before. Default
                    value assumes the current instant of time.
                lastModifiedAfter:
                  type: string
                  format: date-time
                  default: '0001-01-01T00:00:00Z'
                  description: Date and time to filter documents that have been modified after. Default
                    value assumes the beginning of time.
                lastModifiedBefore:
                  type: string
                  format: date-time
                  description: Date and time to filter documents that have been modified before. When
                    omitted, results are not bounded by an upper modified-time limit.
                keywords:
                  type: string
                  description: Keywords to search against document content and titles. This field is truncated
                    to 400 characters. When provided, results will be sorted by relevance to keyword search.
                excludeTrashed:
                  type: boolean
                  description: When set to true, excludes trashed/deleted documents from search results.
                    When set to false or omitted, trashed documents are included in results with their
                    trashedTimestamp populated.
                  default: false
                documentLocation:
                  type: string
                  enum:
                  - repositories
                  description: When provided, restricts search results to documents contained within repositories
                    the authenticated user can access. Only the value "repositories" is supported on this
                    endpoint.
                owners:
                  type: array
                  items:
                    type: number
                  description: When provided, limit the search to documents owned by at least one of the
                    specified users. Results are still restricted to documents the authenticated user
                    can access. A maximum of 10000 users may be specified.
                externalAccess:
                  type: string
                  enum:
                  - any
                  - external-collaborators
                  - external-links
                  description: Specify to search for documents with either “any” type of external access,
                    “external-collaborators”, or "external-links"
                statusIds:
                  type: array
                  items:
                    type: number
                  description: List of statusIds to filter by.
                documentIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: List of documentIds to filter by. A maximum of 10000 documents may be specified.
      responses:
        '200':
          description: OK with an array of Document Resource objects containing information about documents
            the authenticated user has access to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request if the request does not contain a body.
        '403':
          description: Forbidden if the product query parameter is used and the token's scopes do not
            contain the matching readonly scope for each product.
        '429':
          description: Too Many Requests if the account makes more than 300 requests in 5 seconds.
  /v1/documents/{id}/contents:
    get:
      summary: Document Contents
      description: 'Retrieves information about the contents of the requested Lucidchart or Lucidspark
        document.


        Due to the evolving nature of Lucid documents, an unchanged document may produce varying results
        over time.

        '
      operationId: getDocumentContent
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentReadonly
