  /v1/documents:
    post:
      summary: Create Document
      description: 'Creates a new document for the requesting user, with the specified title. Requires
        `title` and `product`. Optionally, a `parent` folder, `extensionBootstrapData`, or Lucid Standard
        Import `content` can be provided to customize the new document.


        > 📘

        >

        > This endpoint can only create a new Lucidchart or Lucidspark document. It cannot modify an existing
        document''s contents.


        > 📘 ##### Document Creation Location

        >

        > When there is no `parent` field on the request, the new document will be created in a default
        location depending on the authorizing token''s scopes.

        >

        > - If the token authorizing the request uses one of the `document.app` scopes, then the document
        will be created in an `app-specific folder`.

        > - If one of the `document.content` scopes is used, the document will be created in the user''s
        ''My Documents folder''.

        > - If both types of scopes are authorized on the token, the `document.content` behavior will
        take priority and the document will be created in the user''s ''My Documents'' folder.


        > 📘 ##### Bootstrap Data for Create Document

        >

        > Bootstrap data can be attached to the created document to be consumed by a specific [Extension
        Package](https://lucid.readme.io/docs/lucid-extension-api). See [Bootstrap Data for documents
        created via API](https://lucid.readme.io/docs/editor-extension-data#bootstrap-data-for-documents-created-via-api)
        for usage.


        > 📘 Standard Import

        >

        > When `content` is provided, it must conform to the Lucid Standard Import schema. For more information
        on how to use the Standard Import, refer to the extensive reference documentation [here](doc:overview-si).

        >

        > For examples of how to use the Standard Import, refer to the `/standard-import` folder in Lucid''s
        repository of [Sample Lucid REST Applications](https://github.com/lucidsoftware/sample-lucid-rest-applications/tree/main/standard-import).
        This repo also contains some example `.zip` Standard Import files you can reference or use in
        your own projects.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidchart.document.app.folder`

        - `lucidspark.document.content`

        - `lucidspark.document.app.folder`

        '
      operationId: createDocument
      tags:
      - Document Access
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidchart.document.app.folder
        - lucidspark.document.content
        - lucidspark.document.app.folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - product
              properties:
                title:
                  type: string
                  description: Title that should be given to the newly created document.
                product:
                  $ref: '#/components/schemas/CreatableProduct'
                parent:
                  type: number
                  description: Folder ID for the new document.
                extensionBootstrapData:
                  $ref: '#/components/schemas/BootstrapData'
                content:
                  $ref: '#/components/schemas/LucidStandardImportContent'
      responses:
        '201':
          description: 'Created with Document resource containing information about the newly created
            document.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad Request. * `'content' and 'extensionBootstrapData' cannot both be provided`
            — the `content` field is mutually exclusive with `extensionBootstrapData`. * Invalid `content`
            JSON — the provided content does not conform to the Lucid Standard Import schema.
        '403':
          description: Forbidden. * if the user doesn't have access to or permissions to create within
            the specified parent folder. * if the token authorizing the request has the document.app scope
            with a specified parent folder that is outside the app folder's folder tree.
  /v1/documents/create:
    post:
      summary: Create Document with Standard Import File
      description: 'Creates a new document from a Lucid Standard Import file (`.zip` archive) uploaded
