      summary: List Repositories
      description: Retrieves basic information for all repositories the authenticated user has permission
        to view.
      operationId: listRepositories
      tags:
      - Repositories
      security:
      - ApiKey:
        - RepositoryRead
      - OAuth2:
        - repository:readonly
      responses:
        '200':
          description: OK. Returns a list of repositories the user has access to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryObject'
        '403':
          description: Forbidden. Occurs when the user does not have access to view any repository.
    post:
      summary: Create Repository
      description: Creates a new repository on the account.
      operationId: createRepository
      tags:
      - Repositories
      security:
      - ApiKey:
        - RepositoryEdit
      - OAuth2:
        - repository
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepositoryRequest'
      responses:
        '201':
          description: Created. Returns the newly created repository.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryObject'
        '400':
          description: Bad Request. Occurs when no owner is provided, members or groups are added to an
            UNRESTRICTED repository, or invalid user/group IDs.
        '403':
          description: Forbidden. Occurs when the user does not have permission to create a repository.
  /v1/repositories/{repositoryId}:
    get:
      summary: Get Repository
      description: Retrieves basic information for the requested repository, provided the user has at
        least read-only access.
      operationId: getRepository
      tags:
      - Repositories
      security:
      - ApiKey:
        - RepositoryRead
      - OAuth2:
        - repository:readonly
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RepositoryId'
        description: The unique identifier of the repository
      responses:
        '200':
          description: OK. Returns the repository object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryObject'
        '403':
          description: Forbidden. Occurs when the user does not have access to the repository.
  /v1/repositories/{repositoryId}/users:
    get:
      summary: List Repository User Collaborators
      operationId: listRepositoryUsers
      tags:
      - Repositories
      description: List users with roles on a repository.
      security:
      - ApiKey:
        - RepositoryRead
      - OAuth2:
        - repository:readonly
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RepositoryId'
        description: The unique identifier of the repository
      responses:
        '200':
          description: OK. Returns a list of users and their roles on the repository.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryUser'
        '403':
          description: Forbidden. Occurs when the user does not have access to view repository owners
            or members.
  /v1/repositories/{repositoryId}/users/add:
    post:
      summary: Create or Update Repository User Roles
      operationId: addRepositoryUsers
      tags:
      - Repositories
      description: Manages user roles on a repository, allowing for updating of existing repository users
        or adding roles for new users on the repository.
      security:
      - ApiKey:
        - RepositoryEdit
      - OAuth2:
        - repository
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RepositoryId'
        description: The unique identifier of the repository
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRepositoryUsersRequest'
      responses:
        '204':
          description: No Content. User and group roles have been successfully added or updated.
        '400':
          description: Bad Request. Occurs when duplicate or invalid user IDs are provided, or REPOSITORY_MEMBERs
            are added to an UNRESTRICTED repository.
        '403':
          description: Forbidden. Occurs when the user does not have permission to modify the repository.
  /v1/repositories/{repositoryId}/users/remove:
    post:
      summary: Remove Users from Repository
      operationId: removeRepositoryUsers
      tags:
      - Repositories
      description: Removes one or more users from a repository.
      security:
      - ApiKey:
        - RepositoryEdit
      - OAuth2:
        - repository
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RepositoryId'
        description: The unique identifier of the repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  items:
                    type: integer
                    description: User ID to remove from the repository
                    example: 123321
                  minItems: 1
                  description: Array of user IDs to remove from the repository
              required:
              - users
      responses:
        '204':
          description: No Content. Users have been successfully removed from the repository.
        '403':
          description: Forbidden. Occurs when the user does not have permission to modify the repository.
  /v1/repositories/{repositoryId}/groups:
    get:
      summary: List Repository Groups
      operationId: listRepositoryGroups
      tags:
      - Repositories
      description: List groups with repository member access.
      security:
      - ApiKey:
        - RepositoryRead
      - OAuth2:
        - repository:readonly
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RepositoryId'
        description: The unique identifier of the repository
      responses:
        '200':
          description: OK. Returns a list of groups with access to the repository.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RepositoryGroupCollaborator'
        '400':
          description: Bad Request. Occurs when attempting to list groups on an UNRESTRICTED repository.
        '403':
          description: Forbidden. Occurs when the user does not have access to the repository.
  /v1/repositories/{repositoryId}/groups/add:
    post:
      summary: Add Groups as Members on Repository
      operationId: addRepositoryGroups
      tags:
      - Repositories
      description: Add Groups to a repository. Users in the Group will have repository member access to
        the specified repository.
      security:
      - ApiKey:
        - RepositoryEdit
      - OAuth2:
        - repository
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RepositoryId'
        description: The unique identifier of the repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryGroupsRequest'
      responses:
        '204':
          description: No Content. Groups have been successfully added.
        '400':
          description: Bad Request. Occurs when groups are added to an UNRESTRICTED repository, or invalid
            group IDs are provided.
        '403':
          description: Forbidden. Occurs when the user does not have permission to modify the repository.
  /v1/repositories/{repositoryId}/groups/remove:
    post:
      summary: Remove Groups from Repository
      operationId: removeRepositoryGroups
      tags:
      - Repositories
      description: Removes one or more groups from a restricted repository.
      security:
      - ApiKey:
        - RepositoryEdit
      - OAuth2:
        - repository
      parameters:
      - name: repositoryId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/RepositoryId'
        description: The unique identifier of the repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepositoryGroupsRequest'
      responses:
        '204':
          description: No Content. Groups have been successfully removed from the repository.
        '400':
          description: Bad Request. Occurs when attempting to remove groups from an UNRESTRICTED repository.
        '403':
          description: Forbidden. Occurs when the user does not have permission to modify the repository.
  /v1/documents/{documentId}/threads:
    get:
      summary: List Document Threads
      description: 'Retrieves all comment threads for the specified document. Each thread includes its
        ID, creation timestamp, and status (open or closed).


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentReadonly`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content:readonly`

        - `lucidscale.document.content:readonly`

        - `lucidspark.document.content:readonly`

        - `lucid.document.content:readonly`

        '
      operationId: listDocumentThreads
      tags:
      - Document Comments
      security:
      - ApiKey:
        - DocumentReadonly
      - OAuth2:
        - lucidchart.document.content:readonly
        - lucidscale.document.content:readonly
        - lucidspark.document.content:readonly
        - lucid.document.content:readonly
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to retrieve comment threads for.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      responses:
        '200':
          description: OK with an array of Document Thread resources for the document's comment threads.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentThread'
        '400':
          description: Bad Request if the document ID is malformed.
        '403':
          description: Forbidden if the app making the request does not have permission to the document,
            or if the document does not exist.
  /v1/documents/{documentId}/threads/{threadId}/comments:
    get:
      summary: List Thread Comments
      description: 'Retrieves all comments within a specific thread of a document. Each comment includes
        the author, comment text, creation timestamp, and any assigned users.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentReadonly`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content:readonly`

        - `lucidscale.document.content:readonly`

        - `lucidspark.document.content:readonly`

        - `lucid.document.content:readonly`

        '
      operationId: listDocumentThreadComments
      tags:
      - Document Comments
      security:
      - ApiKey:
        - DocumentReadonly
      - OAuth2:
        - lucidchart.document.content:readonly
        - lucidscale.document.content:readonly
        - lucidspark.document.content:readonly
        - lucid.document.content:readonly
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document containing the thread.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      - name: threadId
        in: path
        required: true
        schema:
          type: string
        description: ID of the comment thread to retrieve comments for.
        example: abc123
      responses:
        '200':
          description: OK with an array of Document Comment resources for the thread's comments.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentComment'
        '400':
          description: Bad Request if the document ID is malformed.
        '403':
          description: Forbidden if the app making the request does not have permission to the document,
            or if the document does not exist.
        '404':
          description: Not Found if the specified thread does not exist on the document.
    post:
      summary: Post Thread Comment
      description: 'Posts a new comment to an existing thread on a document. The comment text must be
        non-empty and cannot exceed 10,000 characters.


        ## Valid Authentication Methods


        **API Key Grants:**

        - `DocumentEdit`


        **OAuth 2.0 User Token Scopes:**

        - `lucidchart.document.content`

        - `lucidscale.document.content`

        - `lucidspark.document.content`

        - `lucid.document.content`

        '
      operationId: postDocumentThreadComment
      tags:
      - Document Comments
      security:
      - ApiKey:
        - DocumentEdit
      - OAuth2:
        - lucidchart.document.content
        - lucidscale.document.content
        - lucidspark.document.content
        - lucid.document.content
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document containing the thread.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      - name: threadId
        in: path
        required: true
        schema:
          type: string
        description: ID of the comment thread to post a comment to.
        example: abc123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCommentRequestBody'
      responses:
        '204':
          description: No Content when the comment is successfully posted.
        '400':
          description: 'Bad Request.

            * Comment must be non-empty.

            * Comment must not exceed 10,000 characters.

            * Comment cannot be posted to a closed thread.

            '
        '403':
          description: Forbidden if the app making the request does not have write permission to the document,
            or if the document does not exist.
        '404':
          description: Not Found if the specified thread does not exist on the document.
  /v1/subscriptions:
    get:
      summary: List Subscriptions
      description: Lists all subscriptions on the authenticated user's Lucid account. This endpoint is
        paginated.
      operationId: listSubscriptions
      tags:
      - Subscriptions
      security:
      - ApiKey:
        - LicensesAdmin
      - OAuth2:
        - licenses:admin.readonly
        - licenses:admin
      responses:
        '200':
          description: OK. Returns an array of subscriptions on the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
        '403':
          description: Forbidden. Occurs when the user is not authorized to view subscriptions.
  /v1/subscriptions/{id}:
    get:
      summary: Get Subscription
      description: Retrieves details about a specific subscription on the account.
      operationId: getSubscription
      tags:
      - Subscriptions
      security:
      - ApiKey:
        - LicensesAdmin
      - OAuth2:
        - licenses:admin.readonly
        - licenses:admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Subscription ID
        example: 8e8cf611-d74c-4a2f-8b61-754b22328fbb
      responses:
        '200':
          description: OK. Returns the subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '403':
          description: Forbidden. Occurs when the user is not authorized to view subscriptions or the
            subscription does not exist.
  /v1/subscriptions/{id}/licenses:
    get:
      summary: List Licenses for Subscription
      description: Lists all licenses associated with a specific subscription. This endpoint is paginated.
      operationId: listSubscriptionLicenses
      tags:
      - Licenses
      security:
      - ApiKey:
        - LicensesAdmin
      - OAuth2:
        - licenses:admin.readonly
        - licenses:admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Subscription ID
        example: 8e8cf611-d74c-4a2f-8b61-754b22328fbb
      responses:
        '200':
          description: OK. Returns an array of licenses associated with the specified subscription.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/License'
        '403':
          description: Forbidden. Occurs when the user is not authorized to view licenses or the subscription
            does not exist.
  /v1/users/{id}/licenses:
    get:
      summary: List User Licenses
      description: Retrieves all licenses that have been granted to a specific user on the account.
      operationId: listUserLicenses
      tags:
      - Licenses
      security:
      - ApiKey:
        - LicensesAdmin
      - OAuth2:
        - licenses:admin.readonly
        - licenses:admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: User ID
        example: 123
      responses:
        '200':
          description: OK. Returns an array of licenses granted to the specified user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/License'
        '403':
          description: Forbidden. Occurs when the user is not authorized to view licenses or the user
            does not exist.
    post:
      summary: Grant User License
      description: Grants a license to a user from a specified subscription. If the user already has a
        license on the given subscription, the existing license is returned.
      operationId: grantUserLicense
      tags:
      - Licenses
      security:
      - ApiKey:
        - LicensesAdmin
      - OAuth2:
        - licenses:admin
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: User ID
        example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantLicenseRequest'
      responses:
        '201':
          description: Created. Returns the granted license, or the existing license if the user already
            has one on this subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/License'
        '403':
          description: Forbidden. Occurs when the user is not authorized to grant licenses.
        '409':
          description: Conflict. Occurs when there are no available licenses to grant, or the user is
            restricted from being granted a license.
components:
  schemas:
    OAuth2Token:
      type: object
      properties:
        access_token:
          type: string
          description: Token to be used when making requests with OAuth 2.0 authentication.
          example: oauth2-Yzh4Y2Q3ZTVhY2FjYjkwOGJlZGNjNjU5NDM2NjgzZmUwMmNmMjkzM...
        client_id:
          type: string
          description: The client ID.
          example: 30VYbvlkqZv-SmJd7fTdpH9B9et2yqZA6Wvi5NY_
        expires_in:
          type: number
          description: The lifetime in seconds of the access token.
          example: 3600
        expires:
          type: number
          format: int64
          description: Time until this token expires (expressed in milliseconds since Unix epoch).
          example: 1605732868411
        refresh_token:
          type: string
          description: If the token includes the scope `offline_access`, then a refresh token will be
            provided.
          example: oauth2-AVU=-yPcwtzLkusIEnT7D9slQH4g8Ur0MdpUmpT0Z6BSMf6lmesRpTTSBGNniKd
        scopes:
          type: array
          items:
            type: string
          description: Scopes granted on this token.
          example:
          - lucidchart.document.app
          - offline_access
        token_type:
          type: string
          description: Value is always "bearer".
          example: bearer
        user_id:
          type: number
          description: ID of the user this token is on behalf of. Only returned when the token was granted
            on behalf of a user. Mutually exclusive with `account_id`.
          example: 341
        account_id:
          type: number
          description: ID of the account this token is on behalf of. Only returned when the token was
            granted on behalf of an account. Mutually exclusive with `user_id`.
          example: 52
      required:
      - access_token
      - user_id
      - account_id
      - client_id
      - expires_in
      - expires
      - scopes
      - token_type
    OAuth2IntrospectToken:
      type: object
      properties:
        active:
          type: boolean
          description: A boolean value indicating whether or not the token is active.
          example: true
        client_id:
          type: string
          description: The client ID.
          example: 30VYbvlkqZv-SmJd7fTdpH9B9et2yqZA6Wvi5NY_
        expires_in:
          type: number
          description: The remaining lifetime in seconds of the access token.
          example: 3500
        expires:
          type: number
          format: int64
          description: Timestamp for when this token expires (expressed in milliseconds since Unix epoch).
          example: 1605732868411
        scope:
          type: string
          description: Space-separated list of scopes allowed on this token.
          example: document.app offline_access
        token_type:
          type: string
          description: The type of token returned (currently, always "bearer").
          example: bearer
        user_id:
          type: number
          description: ID of the user this token is on behalf of. Only returned when the token was granted
            on behalf of a user. Mutually exclusive with `account_id`.
          example: 1001
        account_id:
          type: number
          description: ID of the account this token is on behalf of. Only returned when the token was
            granted on behalf of an account. Mutually exclusive with `user_id`.
          example: 52
      required:
      - active
      - user_id
      - account_id
      - client_id
      - token_type
      - scope
      - expires_in
      - expires
    AccountInformationResource:
      type: object
      properties:
        id:
          type: number
          description: The unique ID for the authenticated account.
        name:
          type: string
          nullable: true
          description: The name assigned to the account. This field is null if no name has been assigned.
            Names are usually set by an admin and can be a helpful way to orient a user by informing them
            about which account an app will interact with.
      required:
      - id
      - name
    Classification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique ID of the classification.
          example: b7db4f07-5225-4a0c-8313-0fe199eec844
        label:
          type: string
          description: Display name of the classification.
          example: private
        priority:
          type: integer
          description: Priority of the classification.
          example: 1
        description:
          type: string
          nullable: true
          description: Optional description of the classification.
          example: For documents with sensitive customer data
        guidelineUrl:
          type: string
          nullable: true
          description: Optional URL linking to classification guidelines.
          example: https://lucid.app/lucidspark/classification-guidelines
      required:
      - id
      - label
      - priority
    Product:
      type: string
      enum:
      - lucidchart
      - lucidscale
      - lucidspark
      description: The Lucid Suite product that a document was created in.
      example: lucidchart
    AccountDocument:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
          description: Unique ID of the document
          example: 110808fd-4553-4316-bccf-4f25ff59a532
        title:
          type: string
          description: Title of the document
          example: document title
        adminViewUrl:
          type: string
          format: uri
          description: Link to view the document
          example: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/adminView
        created:
          type: string
          format: date-time
          description: Date and time of when the document was created
          example: '2019-04-22T13:47:23Z'
        owner:
          type: object
          properties:
            ownerType:
              type: string
              description: user or account
            id:
              type: number
              description: userId or accountId
        lastModified:
          type: string
          format: date-time
          description: Date and time of when the document was last modified
          example: '2020-06-26T16:29:37Z'
        trashed:
          type: string
          format: date-time
          nullable: true
          description: If defined, the timestamp when the document was moved to the trash
          example: null
        customTags:
          type: array
          items:
            type: string
          description: List of any custom tags assigned to the document
          example:
          - in progress
        product:
          $ref: '#/components/schemas/Product'
        status:
          type: string
          nullable: true
          description: Current assigned status of the document
          example: Complete
        classification:
          type: string
          nullable: true
          description: Current assigned classification of the document
          example: Private
        parent:
          type: integer
          nullable: true
          description: ID of the parent folder
          example: 123456788
        userCollaboratorIds:
          type: array
          items:
            type: integer
          description: List of IDs of users that are collaborators on the document
          example:
          - 206418105
          - 206418104
          - 206418103
        teamCollaboratorIds:
          type: array
          items:
            type: integer
          description: List of IDs of teams that are collaborators on the document
          example:
          - 111000660
          - 111000661
          - 111000659
      required:
      - documentId
      - title
      - adminViewUrl
      - created
      - owner
      - lastModified
      - customTags
      - product
      - userCollaboratorIds
      - teamCollaboratorIds
      example:
        documentId: 110808fd-4553-4316-bccf-4f25ff59a532
        title: document title
        adminViewUrl: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/adminView
        created: '2019-04-22T13:47:23Z'
        owner:
          ownerType: user
          id: '123456'
        lastModified: '2020-06-26T16:29:37Z'
        customTags:
        - in progress
        product: lucidchart
        status: Complete
        parent: 123456788
        trashed: null
        userCollaboratorIds:
        - 206418105
        - 206418104
        - 206418103
        teamCollaboratorIds:
        - 111000660
        - 111000661
        - 111000659
    LegalHold:
      type: object
      properties:
        LegalHoldId:
          type: string
          format: uuid
          description: Unique ID of the legal hold.
          example: 110808fd-4553-4316-bccf-4f25ff59a532
        AccountId:
          type: number
          description: Unique ID for the creating admin’s account.
          example: 100
        StartTime:
          type: string
          format: date-time
          description: Start time of the legal hold.
          example: '2025-01-01T16:18:26Z'
        EndTime:
          type: string
          format: date-time
          description: End time of the legal hold.
          example: '2025-12-01T16:18:26Z'
        Title:
          type: string
          description: Title of the legal hold.
          example: New Legal Hold
        Description:
          type: string
          description: Description of the legal hold.
          example: Legal hold example
        Keywords:
          type: string
          description: Keyword(s) of the legal hold.
          example: alpha
        Created:
          type: string
          format: date-time
          description: Time that the legal hold was created.
          example: '2024-12-01T16:25:44Z'
        Modified:
          type: string
          format: date-time
          description: Time that the legal hold was last modified.
          example: '2024-12-01T16:25:44Z'
      required:
      - LegalHoldId
      - AccountId
      - StartTime
      - EndTime
      - Title
      - Created
      - Modified
    Avatar:
      type: object
      properties:
        type:
          type: string
          enum:
          - url
          example: url
          description: The kind of avatar. Currently always `url`, indicating the avatar is referenced
            by a link. Additional avatar kinds may be introduced in the future.
        link:
          type: string
          example: https://www.gravatar.com/avatar/00000000000000000000000000000000?s=200&d=404
          description: A URL pointing to the user's avatar image.
      required:
      - type
      - link
      description: A reference to a user's avatar image. When the user has no uploaded avatar, this falls
        back to their Gravatar image.
    User:
      type: object
      properties:
        accountId:
          type: number
          example: 100
          description: The unique ID for the user's account.
        enabled:
          type: boolean
          example: true
          description: Whether the user can authenticate to Lucid. Corresponds to the SCIM active attribute.
        email:
          type: string
          example: john-doe@example.com
          description: The user's email.
        name:
          type: string
          example: John Doe
          description: The user's full name.
        userId:
          type: number
          example: 101
          description: The unique ID for the user.
        username:
          type: string
          example: johndoe
          description: The user's username.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          example:
          - billing-admin
          - team-admin
          description: A list of administrative roles assigned to the user.
        avatar:
          $ref: '#/components/schemas/Avatar'
          description: A reference to the user's avatar image, falling back to their Gravatar image.
      description: A standard representation of a user.
    UserRole:
      type: string
      enum:
      - account-owner
      - billing-admin
      - enterprise-shield-admin
      - developer
      - document-admin
      - group-admin
      - organizational-group-admin
      - team-admin
      - team-manager
      - template-admin
      - unknown-role
      description: Allows various administrative actions.
    CustomAttribute:
      type: object
      properties:
        type:
          type: string
          enum:
          - singleLineText
          - multiLineText
          - singleSelectDropdown
          - multiSelectDropdown
          - webLink
          - numericalRange
          - hierarchicalDropdown
          description: The custom attribute type
          example: singleLineText
        name:
          type: string
          description: Title of the custom attribute. hierarchicalDropdown attributes do not have names.
          example: Sample Label
        value:
          oneOf:
          - type: string
          - type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/DataPair'
              - type: string
          description: The value assigned to the custom attribute. The type of this value is determined
            by the Attribute Type.
          example: null
      description: Object representing a custom attribute value for a document.
      required:
      - type
    DataPair:
      type: object
      properties:
        name:
          type: string
          description: Custom data key
        value:
          type: string
          description: Custom data value
      description: Object representing a key-value pair of data.
      required:
      - name
      - value
      example:
        name: City
        value: New York
    Document:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
          description: Unique ID of the document
          example: 110808fd-4553-4316-bccf-4f25ff59a532
        title:
          type: string
          description: Title of the document
          example: document title
        editUrl:
          type: string
          format: uri
          description: Link to edit the document
          example: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/edit
        viewUrl:
          type: string
          format: uri
          description: Link to view the document
          example: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/view
        version:
          type: integer
          description: Most recent version
          example: 101
        pageCount:
          type: integer
          description: Number of pages within the document
          example: 5
        canEdit:
          type: boolean
          description: If requesting user can edit the document
          example: false
        created:
          type: string
          format: date-time
          description: Date and time of when the document was created
          example: '2019-04-22T13:47:23Z'
        creatorId:
          type: integer
          description: ID of user who created and owns the document
          example: 12345
        lastModified:
          type: string
          format: date-time
          description: Date and time of when the document was last modified
          example: '2020-06-26T16:29:37Z'
        lastModifiedUserId:
          type: integer
          description: ID of user who most recently modified the document
          example: 54321
        customAttributes:
          type: array
          items:
            $ref: '#/components/schemas/CustomAttribute'
          description: List of any custom attributes belonging to the document. Populated for Enterprise
            Accounts only.
          example: []
        customTags:
          type: array
          items:
            type: string
          description: List of any custom tags assigned to the document
          example:
          - in progress
        product:
          $ref: '#/components/schemas/Product'
        status:
          type: string
          nullable: true
          description: Current assigned status of the document
          example: Complete
        classification:
          type: string
          nullable: true
          description: Current assigned classification of the document
          example: Private
        classificationId:
          type: string
          format: uuid
          nullable: true
          description: Current assigned classification ID of the document.
          example: b7db4f07-5225-4a0c-8313-0fe199eec844
        trashed:
          type: string
          format: date-time
          nullable: true
          description: If defined, the timestamp when the document was moved to the trash
          example: null
        parent:
          type: integer
          nullable: true
          description: ID of the parent folder
          example: null
        repository:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Repository'
        accountId:
          type: integer
          nullable: true
          description: ID of Lucid account that owns the document
        owner:
          $ref: '#/components/schemas/DocumentOwner'
      required:
      - documentId
      - title
      - editUrl
      - viewUrl
      - version
      - pageCount
      - canEdit
      - created
      - creatorId
      - lastModified
      - lastModifiedUserId
      - customAttributes
      - customTags
      - product
      - accountId
      example:
        documentId: 110808fd-4553-4316-bccf-4f25ff59a532
        title: document title
        editUrl: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/edit
        viewUrl: https://lucid.app/lucidchart/110808fd-4553-4316-bccf-4f25ff59a532/view
        version: 101
        pageCount: 5
        canEdit: false
        created: '2019-04-22T13:47:23Z'
        creatorId: 12345
        lastModified: '2020-06-26T16:29:37Z'
        lastModifiedUserId: 54321
        customAttributes: []
        customTags:
        - in progress
        product: lucidchart
        status: Complete
        classification: Private
        trashed: null
        parent: null
        repository: null
        owner:
          id: 123456
          type: user
          name: John Doe
        accountId: 1234
    DocumentOwner:
      type: object
      properties:
        id:
          type: number
          description: Id of either the user or the account, depending on the type of the document user
            resource.
          example: 123456
        type:
          type: string
          description: Specifies if the owner resource is referring to a user or an account. Value will
            be either "user" or "account".
          example: user
        name:
          type: string
          description: Full name of the user that owns this document. This field is excluded if this document
            is owned by an account.
          example: John Doe
    Repository:
      type: object
      properties:
        repositoryId:
          type: string
          description: the ID of the repository
          example: repo_2000008
    Role:
      type: string
      enum:
      - owner
      - editandshare
      - edit
      - comment
      - view
      description: The Collaborator Role on the document or folder
    DocumentUserCollaborator:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
          description: Document ID
        userId:
          type: integer
          description: User ID
        role:
          $ref: '#/components/schemas/Role'
        created:
          type: string
          format: date-time
          description: Date and time when the collaboration was created
      required:
      - documentId
      - userId
      - role
      - created
    DocumentTeamCollaborator:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
          description: Document ID
        teamId:
          type: integer
          description: Team ID
        role:
          $ref: '#/components/schemas/Role'
        created:
          type: string
          format: date-time
          description: Date and time when the collaboration was created
      required:
      - documentId
      - teamId
      - role
      - created
    FolderUserCollaborator:
      type: object
      properties:
        folderId:
          type: integer
          description: Folder ID
        userId:
          type: integer
          description: User ID
        role:
          $ref: '#/components/schemas/Role'
        created:
          type: string
          format: date-time
          description: Date and time when the collaboration was created
      required:
      - folderId
      - userId
      - role
      - created
    FolderGroupCollaborator:
      type: object
      properties:
        folderId:
          type: integer
          description: Folder ID
        groupId:
          type: integer
          description: Group ID
        role:
          $ref: '#/components/schemas/Role'
        created:
          type: string
          format: date-time
          description: Date and time when the collaboration was created
      required:
      - folderId
      - groupId
      - role
      - created
    FolderTeamCollaborator:
      type: object
      properties:
        folderId:
          type: integer
          description: Folder ID
        teamId:
          type: integer
          description: Team ID
        role:
          $ref: '#/components/schemas/Role'
        created:
          type: string
          format: date-time
          description: Date and time when the collaboration was created
      required:
      - folderId
      - teamId
      - role
      - created
    CreatableProduct:
      type: string
      enum:
      - lucidchart
      - lucidspark
      description: The Lucid Suite product types that can be created.
      example: lucidchart
    BootstrapData:
      type: object
      properties:
        packageId:
          type: string
          description: Id of the extension package which will consume this data
          example: 74672098-cf36-492c-b8e6-2c4233549cd3
        extensionName:
          type: string
          description: Name of the editor extension which will consume this data. Note this is the name
            field of an editor extension found in your manifest.json file.
          example: sheets-adapter
        minimumVersion:
          type: string
          description: Minimum version of the extension package which will consume this data
          example: 1.4.0
        data:
          type: object
          additionalProperties:
            type: string
          description: Data to provide to the extension package
          example:
            a: 1
            b: 2
      required:
      - packageId
      - extensionName
      - minimumVersion
      - data
      description: Bootstrap data can be attached to the created document to be consumed by a specific
        Extension Package.
    LucidStandardImportContent:
      type: object
      description: 'Defines the content of a document using the Lucid Standard Import format, including
        pages, shapes, and lines.

        Mutually exclusive with `extensionBootstrapData`.

        '
      properties:
        version:
          type: integer
          description: The version of the Lucid Standard Import format.
          enum:
          - 1
          example: 1
        pages:
          type: array
          description: List of pages to create in the document. At least one page is required.
          minItems: 1
          items:
            $ref: '#/components/schemas/LucidStandardImportPage'
        collections:
          type: array
          description: List of data collections to associate with the document.
          items:
            $ref: '#/components/schemas/LucidStandardImportCollection'
        documentSettings:
          $ref: '#/components/schemas/LucidStandardImportDocumentSettings'
      required:
      - version
      - pages
    LucidStandardImportPage:
      type: object
      description: A page definition within a Lucid Standard Import document.
      properties:
        id:
          type: string
          description: Unique identifier for the page within the import.
          example: page1
        title:
          type: string
          description: The title of the page.
          example: Page 1
        shapes:
          type: array
          description: List of shapes to place on the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportShape'
        lines:
          type: array
          description: List of lines to place on the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportLine'
        groups:
          type: array
          description: List of groups to create on the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportGroup'
        layers:
          type: array
          description: List of layers to create on the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportLayer'
        customData:
          type: array
          description: Custom key-value data to attach to the page.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomPageDatum'
        dataBackedShapes:
          type: array
          description: List of data-backed shape generators (e.g., org charts, mind maps).
          items:
            $ref: '#/components/schemas/LucidStandardImportGenerator'
        settings:
          $ref: '#/components/schemas/LucidStandardImportPageSettings'
      required:
      - id
      - title
    LucidStandardImportShape:
      type: object
      description: 'A shape definition within a page. The `type` field determines which kind of shape
        to create.

        Common shape types include `rectangle`, `circle`, `diamond`, `cloud`, `process`, `document`,

        `database`, `hexagon`, `octagon`, `pill`, `roundedRectangle`, `triangle`, `isoscelesTriangle`,

        `stickyNote`, `image`, `table`, `swimLanes`, and many more including BPMN shapes.

        '
      properties:
        id:
          type: string
          description: Unique identifier for the shape within the import. Used to reference this shape
            from lines and groups.
          example: shape1
        type:
          type: string
          description: The type of shape to create.
          enum:
          - bpmnActivity
          - bpmnBlackBoxPool
          - bpmnChoreography
          - bpmnConversation
          - bpmnDataObject
          - bpmnDataStore
          - bpmnEvent
          - bpmnGateway
          - bpmnGroup
          - bpmnPool
          - bpmnTextAnnotation
          - braceContainer
          - braceNote
          - bracketContainer
          - circle
          - circleContainer
          - cloud
          - connector
          - cross
          - namedContainer
          - namedShape
          - data
          - database
          - decision
          - delay
          - diamond
          - diamondContainer
          - directAccessStorage
          - display
          - document
          - doubleArrow
          - flexiblePolygon
          - freehandBlock
          - freehandDrawing
          - hexagon
          - hotspot
          - image
          - internalStorage
          - isoscelesTriangle
          - lucidCard
          - manualInput
          - manualOperation
          - merge
          - multipleDocuments
          - note
          - octagon
          - offPageLink
          - or
          - paperTape
          - pentagon
          - pillContainer
          - polyStar
          - predefinedProcess
          - preparation
          - process
          - rectangle
          - rectangleContainer
          - rightTriangle
          - roundedRectangleContainer
          - singleArrow
          - sparkCalloutSquare
          - sparkContainer
          - sparkFrame
          - stickyNote
          - storedData
          - summingJunction
          - swimLanes
          - table
          - terminator
          - text
          - umlClass
          example: rectangle
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
        text:
          type: string
          description: Text content to display inside the shape.
          example: Hello World
        opacity:
          type: integer
          description: Opacity of the shape, from 0 (fully transparent) to 100 (fully opaque).
          minimum: 0
          maximum: 100
        note:
          type: string
          description: A note to attach to the shape.
        zIndex:
          type: integer
          description: The z-order of the shape on the page.
        customData:
          type: array
          description: Custom key-value data to attach to the shape.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomDatum'
        style:
          $ref: '#/components/schemas/LucidStandardImportStyle'
        actions:
          type: array
          description: Interactive actions attached to the shape (e.g., navigate to a URL or page).
          items:
            $ref: '#/components/schemas/LucidStandardImportAction'
        linkedData:
          type: array
          description: Links to data collection entries.
          items:
            $ref: '#/components/schemas/LucidStandardImportLinkedDatum'
      required:
      - id
      - type
      - boundingBox
    BoundingBox:
      type: object
      description: The bounding box that defines a shape's position and size on the page.
      properties:
        x:
          type: number
          description: The x-coordinate of the top-left corner.
          example: 0
        y:
          type: number
          description: The y-coordinate of the top-left corner.
          example: 0
        w:
          type: number
          description: The width of the bounding box.
          example: 100
        h:
          type: number
          description: The height of the bounding box.
          example: 50
      required:
      - x
      - y
      - w
      - h
    LucidStandardImportLine:
      type: object
      description: A line definition within a page.
      properties:
        id:
          type: string
          description: Unique identifier for the line within the import.
          example: line1
        lineType:
          type: string
          description: The type of line routing.
          enum:
          - straight
          - elbow
          - curved
          example: elbow
        stroke:
          $ref: '#/components/schemas/LucidStandardImportStroke'
        endpoint1:
          $ref: '#/components/schemas/LucidStandardImportEndpoint'
        endpoint2:
          $ref: '#/components/schemas/LucidStandardImportEndpoint'
        text:
          type: array
          description: Text labels to display along the line.
          items:
            $ref: '#/components/schemas/LucidStandardImportLineText'
        customData:
          type: array
          description: Custom key-value data to attach to the line.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomDatum'
        linkedData:
          type: array
          description: Links to data collection entries.
          items:
            $ref: '#/components/schemas/LucidStandardImportLinkedDatum'
        joints:
          type: array
          description: Control points for straight lines.
          items:
            $ref: '#/components/schemas/AbsolutePoint'
        elbowControlPoints:
          type: array
          description: Control points for elbow lines.
          items:
            $ref: '#/components/schemas/AbsolutePoint'
        cornerRadius:
          type: number
          description: Corner radius for elbow line bends.
        zIndex:
          type: integer
          description: The z-order of the line on the page.
        lineJumps:
          type: boolean
          description: 'Whether this line draws a small hump where it crosses other lines.

            When set, overrides the page-level `lineJumps` setting for this

            line only.

            '
      required:
      - id
      - lineType
      - endpoint1
      - endpoint2
    LucidStandardImportStyle:
      type: object
      description: Visual style properties for a shape.
      properties:
        fill:
          $ref: '#/components/schemas/LucidStandardImportFill'
        stroke:
          $ref: '#/components/schemas/LucidStandardImportStroke'
        rounding:
          type: number
          description: Corner rounding radius for the shape. Must be between 0 and 720, inclusive.
          default: 6
          minimum: 0
          maximum: 720
        textColor:
          type: string
          description: Text color as a hex color string.
          example: '#000000'
    LucidStandardImportFill:
      description: 'Fill style for a shape. The `type` field determines the fill kind.

        - `color`: A solid color fill.

        - `image`: An image fill, either by URL or by reference to an image in the import archive.

        '
      discriminator:
        propertyName: type
        mapping:
          color: '#/LucidStandardImportColorFill'
          image: '#/LucidStandardImportImageFill'
      oneOf:
      - $ref: '#/components/schemas/LucidStandardImportColorFill'
      - $ref: '#/components/schemas/LucidStandardImportImageFill'
    LucidStandardImportColorFill:
      type: object
      description: A solid color fill.
      properties:
        type:
          type: string
          enum:
          - color
        color:
          type: string
          description: Fill color as a hex color string.
          example: '#ffffff'
      required:
      - type
      - color
    LucidStandardImportImageFill:
      type: object
      description: An image fill, either by URL or by reference to an image in the import archive.
      properties:
        type:
          type: string
          enum:
          - image
        url:
          type: string
          description: URL of the image. Use this or `ref`, not both.
          example: https://example.com/image.png
        ref:
          type: string
          description: Reference to an image in the import archive. Use this or `url`, not both.
        imageScale:
          type: string
          description: How the image should be scaled within the shape.
          enum:
          - fill
          - page
          - shape
      required:
      - type
    LucidStandardImportAction:
      type: object
      description: 'An interactive action attached to a shape. The `type` field determines the action
        kind.

        '
      discriminator:
        propertyName: type
        mapping:
          url: '#/LucidStandardImportUrlAction'
          gotoPage: '#/LucidStandardImportGotoPageAction'
          gotoDocument: '#/LucidStandardImportGotoDocumentAction'
          toggleLayer: '#/LucidStandardImportToggleLayerAction'
          showLayer: '#/LucidStandardImportShowLayerAction'
          hideLayer: '#/LucidStandardImportHideLayerAction'
      oneOf:
      - $ref: '#/components/schemas/LucidStandardImportUrlAction'
      - $ref: '#/components/schemas/LucidStandardImportGotoPageAction'
      - $ref: '#/components/schemas/LucidStandardImportGotoDocumentAction'
      - $ref: '#/components/schemas/LucidStandardImportToggleLayerAction'
      - $ref: '#/components/schemas/LucidStandardImportShowLayerAction'
      - $ref: '#/components/schemas/LucidStandardImportHideLayerAction'
    LucidStandardImportUrlAction:
      type: object
      description: Navigate to an external URL.
      properties:
        type:
          type: string
          enum:
          - url
        url:
          type: string
          description: The target URL.
          example: https://example.com
        newWindow:
          type: boolean
          description: Whether to open in a new window.
      required:
      - type
      - url
    LucidStandardImportGotoPageAction:
      type: object
      description: Navigate to a page in the current document.
      properties:
        type:
          type: string
          enum:
          - gotoPage
        pageId:
          type: string
          description: The ID of the target page.
          example: page2
      required:
      - type
      - pageId
    LucidStandardImportGotoDocumentAction:
      type: object
      description: Navigate to a page in another document.
      properties:
        type:
          type: string
          enum:
          - gotoDocument
        documentId:
          type: string
          description: The ID of the target document.
        pageId:
          type: string
          description: The ID of the target page within the document.
        newWindow:
          type: boolean
          description: Whether to open in a new window.
      required:
      - type
      - documentId
      - pageId
    LucidStandardImportToggleLayerAction:
      type: object
      description: Toggle visibility of layers.
      properties:
        type:
          type: string
          enum:
          - toggleLayer
        layers:
          type: array
          description: List of layer names to toggle.
          items:
            type: string
      required:
      - type
      - layers
    LucidStandardImportShowLayerAction:
      type: object
      description: Show layers.
      properties:
        type:
          type: string
          enum:
          - showLayer
        layers:
          type: array
          description: List of layer names to show.
          items:
            type: string
      required:
      - type
      - layers
    LucidStandardImportHideLayerAction:
      type: object
      description: Hide layers.
      properties:
        type:
          type: string
          enum:
          - hideLayer
        layers:
          type: array
          description: List of layer names to hide.
          items:
            type: string
      required:
      - type
      - layers
    LucidStandardImportStroke:
      type: object
      description: Stroke styling for a line.
      properties:
        color:
          type: string
          description: Hex color string for the stroke.
          default: '#000000'
          example: '#000000'
        width:
          type: number
          description: Stroke thickness. Must be between 0 and 10, inclusive.
          default: 2
          minimum: 0
          maximum: 10
          example: 2
        style:
          type: string
          description: The stroke dash style.
          enum:
          - solid
          - dotted
          - dashed
          default: solid
          example: solid
    LucidStandardImportEndpoint:
      type: object
      description: 'An endpoint of a line. The `type` field determines how the endpoint is positioned.

        - `shapeEndpoint`: Connects to a shape by its ID.

        - `positionEndpoint`: Connects to an absolute position on the page.

        - `lineEndpoint`: Connects to another line at a relative position.

        '
      discriminator:
        propertyName: type
        mapping:
          shapeEndpoint: '#/LucidStandardImportShapeEndpoint'
          positionEndpoint: '#/LucidStandardImportPositionEndpoint'
          lineEndpoint: '#/LucidStandardImportLineEndpoint'
      oneOf:
      - $ref: '#/components/schemas/LucidStandardImportShapeEndpoint'
      - $ref: '#/components/schemas/LucidStandardImportPositionEndpoint'
      - $ref: '#/components/schemas/LucidStandardImportLineEndpoint'
    LucidStandardImportShapeEndpoint:
      type: object
      description: An endpoint connected to a shape.
      properties:
        type:
          type: string
          enum:
          - shapeEndpoint
        style:
          $ref: '#/components/schemas/EndpointStyle'
        shapeId:
          type: string
          description: The ID of the shape to connect to.
          example: shape1
        position:
          $ref: '#/components/schemas/RelativePoint'
          description: Optional relative position on the shape to connect to. If omitted, uses smart auto-linking.
      required:
      - type
      - style
      - shapeId
    LucidStandardImportPositionEndpoint:
      type: object
      description: An endpoint at an absolute position on the page.
      properties:
        type:
          type: string
          enum:
          - positionEndpoint
        style:
          $ref: '#/components/schemas/EndpointStyle'
        position:
          $ref: '#/components/schemas/AbsolutePoint'
      required:
      - type
      - style
      - position
    LucidStandardImportLineEndpoint:
      type: object
      description: An endpoint connected to another line.
      properties:
        type:
          type: string
          enum:
          - lineEndpoint
        style:
          $ref: '#/components/schemas/EndpointStyle'
        lineId:
          type: string
          description: The ID of the line to connect to.
          example: line1
        position:
          type: number
          description: Relative position along the line (0 to 1 inclusive).
          minimum: 0
          maximum: 1
      required:
      - type
      - style
      - lineId
      - position
    EndpointStyle:
      type: string
      description: The visual style of a line endpoint.
      enum:
      - none
      - aggregation
      - arrow
      - hollowArrow
      - openArrow
      - async1
      - async2
      - closedSquare
      - openSquare
      - bpmnConditional
      - bpmnDefault
      - closedCircle
      - openCircle
      - composition
      - exactlyOne
      - generalization
      - many
      - nesting
      - one
      - oneOrMore
      - zeroOrMore
      - zeroOrOne
      example: arrow
    LucidStandardImportLineText:
      type: object
      description: A text label on a line.
      properties:
        text:
          type: string
          description: The text content.
        position:
          type: number
          description: Relative position along the line (0 to 1 inclusive).
          default: 0.5
          minimum: 0
          maximum: 1
        side:
          type: string
          description: Which side of the line the text appears on.
          enum:
          - top
          - middle
          - bottom
          default: middle
      required:
      - text
    AbsolutePoint:
      type: object
      description: An absolute point on the page canvas.
      properties:
        x:
          type: number
          description: The x-coordinate. Must be between -1200000 and 1200000, inclusive.
        y:
          type: number
          description: The y-coordinate. Must be between -1200000 and 1200000, inclusive.
      required:
      - x
      - y
    RelativePoint:
      type: object
      description: A relative point with coordinates between 0 and 1, inclusive.
      properties:
        x:
          type: number
          description: The relative x-coordinate (0 to 1).
          minimum: 0
          maximum: 1
        y:
          type: number
          description: The relative y-coordinate (0 to 1).
          minimum: 0
          maximum: 1
      required:
      - x
      - y
    LucidStandardImportGroup:
      type: object
      description: A group of items on a page.
      properties:
        id:
          type: string
          description: Unique identifier for the group.
          example: group1
        items:
          type: array
          description: 'List of item IDs (shapes, lines, groups) contained in this group. An item can
            belong to only one group. If an item ID is specified in multiple groups, it is assigned to
            the first group encountered, and all subsequent references to that item ID are ignored.

            '
          items:
            type: string
        customData:
          type: array
          description: Custom key-value data to attach to the group.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomDatum'
        linkedData:
          type: array
          description: Links to data collection entries.
          items:
            $ref: '#/components/schemas/LucidStandardImportLinkedDatum'
        note:
          type: string
          description: A note to attach to the group.
        zIndex:
          type: integer
          description: The z-order of the group on the page.
      required:
      - id
    LucidStandardImportLayer:
      type: object
      description: A layer on a page. Layers can contain shapes, lines, and groups.
      properties:
        id:
          type: string
          description: Unique identifier for the layer.
          example: layer1
        title:
          type: string
          description: The display name of the layer.
          example: Background
        items:
          type: array
          description: 'List of item IDs (shapes, lines, groups) contained in this layer. An item can
            belong to only one layer. If an item ID is specified in multiple layers, it is assigned to
            the first layer encountered, and all subsequent references to that item ID are ignored.

            '
          items:
            type: string
        customData:
          type: array
          description: Custom key-value data to attach to the layer.
          items:
            $ref: '#/components/schemas/LucidStandardImportCustomDatum'
        linkedData:
          type: array
          description: Links to data collection entries.
          items:
            $ref: '#/components/schemas/LucidStandardImportLinkedDatum'
        note:
          type: string
          description: A note to attach to the layer.
        layerIndex:
          type: integer
          description: The index order of the layer.
      required:
      - id
      - title
    LucidStandardImportDocumentSettings:
      type: object
      description: Document-level settings for a Lucid Standard Import.
      properties:
        units:
          type: string
          description: The measurement unit for the document. Defaults to inches (`in`) if not specified.
          enum:
          - in
          - cm
          - px
          - pt
          default: in
          example: in
    LucidStandardImportPageSettings:
      type: object
      description: Page-level settings for a Lucid Standard Import page.
      properties:
        fillColor:
          type: string
          description: Background fill color for the page as a hex color string.
          example: '#ffffff'
        infiniteCanvas:
          type: boolean
          description: Whether the page uses an infinite canvas.
        size:
          $ref: '#/components/schemas/LucidStandardImportPageSize'
        autoTiling:
          type: boolean
          description: Whether auto-tiling is enabled for the page.
        lineJumps:
          type: boolean
          description: 'Whether lines on this page draw small humps where they cross

            other lines. Individual lines may override this with their own

            `lineJumps` setting.

            '
    LucidStandardImportPageSize:
      description: 'Page size configuration. Either a standard page size with an optional format, or a
        custom size with explicit dimensions.

        '
      oneOf:
      - $ref: '#/components/schemas/LucidStandardImportStandardPageSize'
      - $ref: '#/components/schemas/LucidStandardImportCustomPageSize'
    LucidStandardImportStandardPageSize:
      type: object
      description: A standard named page size.
      properties:
        type:
          type: string
          description: The standard page size name.
          enum:
          - letter
          - legal
          - executive
          - a3
          - a4
          - a5
          - tabloid
          - folio
          - statement
          example: letter
        format:
          type: string
          description: Page orientation.
          enum:
          - landscape
          - portrait
          default: portrait
      required:
      - type
    LucidStandardImportCustomPageSize:
      type: object
      description: A custom page size with explicit dimensions.
      properties:
        w:
          type: number
          description: Width of the page. Must be between 1.0 and 20000.0, inclusive.
          minimum: 1
          maximum: 20000
        h:
          type: number
          description: Height of the page. Must be between 1.0 and 20000.0, inclusive.
          minimum: 1
          maximum: 20000
      required:
      - w
      - h
    LucidStandardImportCollection:
      type: object
      description: 'A data collection to associate with the document. Exactly one of `dataSource` or `values`
        must be provided — providing both or neither is an error.

        '
      properties:
        id:
          type: string
          description: Unique identifier for the collection.
      required:
      - id
      oneOf:
      - title: Data source reference
        required:
        - dataSource
        properties:
          dataSource:
            type: string
            description: The data source this collection belongs to.
      - title: Inline values
        required:
        - values
        properties:
          values:
            type: array
            description: 'Inline JSON data for the collection. Each element is an object whose keys become
              the column headers and whose values become the row data.

              '
            items:
              type: object
              additionalProperties: true
    LucidStandardImportCustomDatum:
      type: object
      description: A custom key-value pair attached to an item.
      properties:
        key:
          type: string
          description: The data key.
        value:
          type: string
          description: The data value.
      required:
      - key
      - value
    LucidStandardImportCustomPageDatum:
      type: object
      description: A custom key-value pair attached to a page, optionally globally inherited.
      properties:
        key:
          type: string
          description: The data key.
        value:
          type: string
          description: The data value.
        global:
          type: boolean
          description: When true, this data is globally inherited.
          default: false
      required:
      - key
      - value
    LucidStandardImportLinkedDatum:
      type: object
      description: A reference linking an item to a data collection entry.
      properties:
        collectionId:
          type: string
          description: The ID of the collection containing the data.
        key:
          type: string
          description: The key identifying the data entry within the collection.
      required:
      - collectionId
      - key
    LucidStandardImportGenerator:
      type: object
      description: 'A data-backed shape generator that automatically creates shapes from data.

        The `type` field determines which generator is used.

        '
      properties:
        type:
          type: string
          description: The type of generator.
          enum:
          - orgChart
          - mindMap
          - assistedLayout
          - umlSequence
      required:
      - type
    PatchDocumentRequestBody:
      type: object
      description: Request body for updating a document. At least one field should be provided.
      properties:
        title:
          type: string
          description: New title for the document. Must be non-empty, at most 300 characters, and must
            not start or end with whitespace.
          example: My Updated Document
        parent:
          nullable: true
          description: 'ID of the folder or repository to move the document into. Set to null to move
            the document to the root folder.

            For repositories, use the repository ID prefixed with `repo_` (e.g., `repo_12345`). For folders,
            use the numeric folder ID.

            '
          oneOf:
          - type: integer
            description: Numeric folder ID.
          - type: string
            description: Repository ID prefixed with `repo_`.
          example: 12345
        customTags:
          type: array
          items:
            type: string
          description: List of custom tags to assign to the document. Including this field overwrites
            all existing tags on the document with the provided values. Each tag must be non-empty and
            must not start or end with whitespace. Omitting this field leaves existing tags unchanged;
            set to an empty array to clear all tags.
          example:
          - in progress
        classificationId:
          type: string
          format: uuid
          nullable: true
          description: ID of the classification to assign to the document. Omitting this field leaves
            the existing classification unchanged; set to null to remove the classification.
          example: 1cdad938-bf0f-4a0c-a2f8-bf4eb94225ce
    DocumentContent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Document ID
          example: 8e7b19ec-27ff-40e3-beb8-03f51b1661b2
        title:
          type: string
          description: Title of the document
          example: document title
        product:
          $ref: '#/components/schemas/Product'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Page'
          description: Array of Page resources on the document
        accountId:
          type: integer
          nullable: false
          description: ID of Lucid account that owns the document
        data:
          $ref: '#/components/schemas/Data'
          description: Data contained on the document
      description: Object representing the contents of a Lucidchart document
      required:
      - id
      - title
      - product
      - pages
      - accountId
      - data
      example:
        id: 8e7b19ec-27ff-40e3-beb8-03f51b1661b2
        title: document title
        product: lucidchart
        pages: []
        accountId: 1234
        data:
          collections: []
    Page:
      type: object
      properties:
        id:
          type: string
          description: Page ID
          example: YGcM5DNywbTK
        title:
          type: string
          description: Title of the page
          example: document page title
        index:
          type: integer
          description: 0-Based index of the page in the document
          example: 0
        items:
          $ref: '#/components/schemas/Items'
          description: Shapes, Lines, Groups, and Layers on the page
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
          description: Array of Data Pair resources linked to the page
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
          description: Array of Linked Data resources linked to the page
      description: Object representing a single page of a Lucidchart document.
      required:
      - id
      - title
      - index
      - items
      - customData
      - linkedData
      example:
        id: YGcM5DNywbTK
        title: document page title
        index: 0
        items:
          shapes: []
          lines: []
          groups: []
          layers: []
        customData: []
        linkedData: []
    Items:
      type: object
      properties:
        shapes:
          type: array
          items:
            $ref: '#/components/schemas/Shape'
          description: Array of Shape resources
        lines:
          type: array
          items:
            $ref: '#/components/schemas/Line'
          description: Array of Line resources
        groups:
          type: array
          items:
            $ref: '#/components/schemas/Group'
          description: Array of Group resources
        layers:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
          description: Array of Layer resources
      description: Individual shapes, lines, groups, and layers all contain a unique ItemId identifying
        the object.
      required:
      - shapes
      - lines
      - groups
      - layers
    Shape:
      type: object
      properties:
        id:
          type: string
          description: Shape ID
          example: VTAu-oQASzul
        class:
          type: string
          description: A unique string representing the type of the shape (e.g., ProcessBlock)
          example: ProcessBlock
        textAreas:
          type: array
          items:
            $ref: '#/components/schemas/TextArea'
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
        contains:
          $ref: '#/components/schemas/Contains'
          description: If the shape is a container (e.g., a frame), lists the IDs of shapes, lines, and
            groups contained within it
        image:
          $ref: '#/components/schemas/Image'
          description: If the shape has an image fill, describes the image
        linkUrl:
          type: string
          description: The external website or destination URL attached to the shape, if configured.
          example: https://example.com
      required:
      - id
      - class
      - textAreas
      - customData
      - linkedData
      description: Object representing a shape placed on a page of a document. Note that the ItemId of
        a shape is unique across all groups, layers, shapes, and lines.
    Contains:
      type: object
      properties:
        shapes:
          type: array
          items:
            type: string
          description: Array of IDs of shapes contained within the container
          example:
          - VTAuCB8~evzW
        lines:
          type: array
          items:
            type: string
          description: Array of IDs of lines contained within the container
          example:
          - VTAuo_Y56.q~
        groups:
          type: array
          items:
            type: string
          description: Array of IDs of groups contained within the container
          example:
          - VTAu-dl6qtyx
      required:
      - shapes
      - lines
      - groups
      description: Object listing the IDs of items contained within a container shape (e.g., a frame).
    Image:
      type: object
      properties:
        type:
          type: string
          enum:
          - resource
          - user
          description: Whether the image is a Lucid resource image (`resource`) or a user-uploaded image
            (`user`)
          example: resource
        id:
          type: string
          description: The ID of the resource image. Present when type is `resource`.
          example: T2VkijPHy1qh
        url:
          type: string
          description: The URL of the user-uploaded image. Present when type is `user`.
          example: https://example.com/image.png
      required:
      - type
      description: Object describing the image fill on a shape.
    Line:
      type: object
      properties:
        id:
          type: string
          description: Line ID
          example: VTAuwAeC0_R1
        endpoint1:
          $ref: '#/components/schemas/Endpoint'
        endpoint2:
          $ref: '#/components/schemas/Endpoint'
        textAreas:
          type: array
          items:
            $ref: '#/components/schemas/TextArea'
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
      description: Object representing a line on the page of a document. Note that the ItemId of a line
        is unique across all groups, layers, shapes, and lines.
      required:
      - id
      - endpoint1
      - endpoint2
      - textAreas
      - customData
      - linkedData
    Group:
      type: object
      properties:
        id:
          type: string
          description: Group ID
          example: VTAu-dl6qtyx
        members:
          type: array
          items:
            type: string
          description: Array of IDs of shapes, lines, & groups contained within the group
          example:
          - VTAuCB8~evzW
          - VTAuo_Y56.q~
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
      description: Object representing a group on the page of a document. Note that the ItemId of a group
        is unique across all groups, layers, shapes, and lines.
      required:
      - id
      - members
    Layer:
      type: object
      properties:
        id:
          type: string
          description: Layer ID
          example: VTAu-dl6qtyx
        name:
          type: string
          description: The name of the layer
          example: Layer 1
        members:
          type: array
          items:
            type: string
          description: Array of IDs of shapes, lines, & groups contained within the layer
          example:
          - VTAuCB8~evzW
          - VTAuo_Y56.q~
        customData:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
        linkedData:
          type: array
          items:
            $ref: '#/components/schemas/LinkedData'
      description: Object representing a layer on the page of a document. Note that the ItemId of a layer
        is unique across all groups, layers, shapes, and lines.
      required:
      - id
      - name
      - members
      - customData
      - linkedData
    LinkedData:
      type: object
      properties:
        collection_id:
          type: string
          description: Id of the collection containing the data
          example: ABAuwlf2BTy8
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataPair'
          description: Key-value pairs from the dataset
        primaryKeyValue:
          type: string
          description: The value of the primary key of the dataset
          example: Pkey Value
      description: Object representing data linked to a resource on a document.
      required:
      - data
      - primaryKeyValue
    Endpoint:
      type: object
      properties:
        style:
          type: string
          description: Line end style
          example: Arrow
        connectedTo:
          type: string
          nullable: true
          description: Id of shape or line the line is connected to
          example: null
      description: Object representing the endpoint of a Line.
      required:
      - style
      - connectedTo
    TextArea:
      type: object
      properties:
        label:
          type: string
          description: Text area label
          example: Text
        text:
          type: string
          description: Text displayed in the text area. This is plain text. All formatting has been removed
            & formulas evaluated.
          example: Start here
      description: Object representing a text area on a Shape or Line.
      required:
      - label
      - text
    Data:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
          description: Array of collections
      required:
      - collections
      description: Object representing an array of Collections on a document.
    Collection:
      type: object
      properties:
        id:
          type: string
          description: Id of the collection
          example: ABAuwlf2BTy8
        name:
          type: string
          description: Collection name
          example: Collection 1
        primaryKey:
          type: array
          items:
            type: string
          description: The primary key column name
          example:
          - PKey 1
      required:
      - id
      - name
      - primaryKey
      description: A collection is a container inside of a source of data. A data source can have many
        collections, but a collection can only belong to one data source. A collection can be thought
        of as a tab or individual sheet in a spreadsheet file.
    SessionConfig:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          description: A list of Products that a user can choose a document from to be embedded. Defaults
            to all products.
        viewerType:
          type: object
          properties:
            default:
              $ref: '#/components/schemas/ViewerType'
          description: What type of viewer to load by defaults. If not specified, defaults to rich. Users
            can change this later.
        ui:
          $ref: '#/components/schemas/UI'
        customSettings:
          $ref: '#/components/schemas/ViewerCustomSettings'
    ViewerType:
      type: string
      enum:
      - rich
      - simple
      description: '- rich: The standard Lucid viewer experience. A fully interactive viewer with zoom,
        panning, and support for hotspots and other interactive elements.

        - simple: A basic Lucid viewer experience that can be used in place of the rich viewer if there
        are performance or load time concerns. The simple viewer renders non-interactive raster images
        instead of a high-fidelity vector experience and is a poorer fit for viewing larger documents.

        '
    UI:
      type: string
      enum:
      - viewer
      - settings
      description: '- viewer: When loading an existing embed, go directly to the standard embedded view
        of the document.

        - settings: When loading an existing embed, show the user the embed settings interface before
        taking them to the standard embed view of the document.

        '
    ViewerCustomSettings:
      type: string
      enum:
      - postMessage
      - none
      description: '- postMessage: Display a "Settings for <app>" link in the embed settings view where
        users can update the settings. When clicked, the OpenCustomSettings postMessage event would be
        fired so the app can display its own customized settings view.

        - none: "Settings for <app>" link would not be available in the settings editor.

        '
    FolderAttribute:
      type: object
      description: An attribute assigned to the folder.
      properties:
        name:
          type: string
          description: Name of the attribute
          example: Sample Label
        value:
          description: Value of the attribute. Can be any type, but attributes with the same name will
            always have the same type.
          example: Sample Value
    Folder:
      type: object
      description: A standard representation of a folder.
      properties:
        id:
          type: number
          description: Unique ID of the folder
          example: 123456789
        type:
          $ref: '#/components/schemas/FolderType'
        name:
          type: string
          description: Name of the folder
          example: Folder Name
        parent:
          type: number
          description: ID of the parent folder.
          example: 123456788
          nullable: true
        created:
          type: string
          format: date-time
          description: Date and time of when the folder was created
          example: '2020-06-26T16:29:37Z'
        trashed:
          type: string
          format: date-time
          description: Date and time of when the folder was trashed
          example: '2022-01-20T12:14:18Z'
        attributes:
          type: array
          description: An array of attributes assigned to the folder. Can be null or empty.
          items:
            $ref: '#/components/schemas/FolderAttribute'
      required:
      - id
      - type
      - name
      - created
    FolderType:
      type: string
      description: '* folder - Folders can live in other folders, team folders, or the root of a user’s
        folder manager ("My Documents"). A folder in "My Documents" will have a null parent field.

        * team   - Team folders can never live in another folder and are always located in the "Team Folders"
        section of a user''s folder manager. Team folders will not have a parent field. Learn more

        '
      enum:
      - folder
      - team
      example: folder
    FolderContent:
      type: object
      description: A representation of a single item contained in a folder.
      properties:
        id:
          anyOf:
          - type: string
            format: uuid
          - type: number
          description: Unique ID of the folder or document being referred to. This field will be a Number
            for folders and a UUID for documents.
          example: 123456789
        type:
          $ref: '#/components/schemas/FolderContentType'
        name:
          type: string
          description: Name of the folder or document
          example: Folder Name
        isShortcut:
          type: boolean
          description: A boolean value indicating whether or not the folder or document is a shortcut.
          example: false
        product:
          $ref: '#/components/schemas/Product'
      required:
      - id
      - type
      - name
      - isShortcut
    FolderContentType:
      type: string
      description: '* folder  -  Type denoting that the Folder Content Resource is a folder and will have
        a Number id field and no product field.

        * document  -  Type denoting that the Folder Content Resource is a document and will have a UUID
        id field and will contain a product field.

        '
      enum:
      - folder
      - document
      example: document
    DocumentLinkSecurity:
      type: object
      properties:
        restrictToAccount:
          type: boolean
          description: Whether or not users outside the document's account can accept the share link.
            Changing this value to true will immediately revoke access for any external users who previously
            gained access through this link.
        expires:
          type: string
          format: date-time
          description: If defined, the date and time the share link expires.
        passcode:
          type: string
          description: If defined, the required passcode to accept the share link. The passcode length
            must be between 1 – 80 characters.
          minLength: 1
          maxLength: 80
        allowAnonymous:
          type: boolean
          description: Whether or not the share link allows for anonymous guests.
      required:
      - restrictToAccount
      - allowAnonymous
      example:
        restrictToAccount: false
        expires: '2023-12-11T21:48:35.293Z'
        passcode: password
        allowAnonymous: false
    SharingRole:
      type: string
      enum:
      - editandshare
      - edit
      - comment
      - view
      description: 'Roles determine what actions an invitation will grant on a document. Invitations to
        a document only grant the specified level of access to just that one document. If a link''s role
        is changed, the new role applies immediately to all users who accessed via that link.

        - `editandshare`: View, comment on, edit, and control which users can access the document.

        - `edit`: View, comment on, and edit the document.

        - `comment`: View the document. Leave comments on the document.

        - `view`: View the document.

        '
    DocumentShareLink:
