        '429':
          description: Too Many Requests if the account makes more than 100 requests in 5 seconds.
  /v1/embeds:
    get:
      summary: Embed Viewer
      description: Display an embed within an iframe. If no embed id was included when creating the token,
        the iframe first displays a document picker where the user can create and configure a new embed.
        If an embed id was included, the iframe displays either an embedded document viewer, an embedded
        editor, or an embed configuration page depending on the token request body and embed settings.
      operationId: documentEmbeds
      tags:
      - Document Embedding
      security:
      - OAuth2: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
        description: The embed session token retrieved from the Generate Embed Session Token endpoint.
      responses:
        '200':
          description: The iframe content displaying the embedded document picker or viewer.
          content:
            text/html:
              schema:
                type: string
        '401':
          description: Unauthorized. The token is missing or invalid.
        '403':
          description: Forbidden. The access to the embed is forbidden.
        '404':
          description: Not Found. The embed id is not found.
  /v1/embeds/token:
    post:
      summary: Generate Embed Session Token
      description: Generates a short-lived, limited-scope temporary access token to allow your app to
        display embedded Lucid documents in an iframe. The token allows the embedding website to load
        the document picker and document viewer, but does not grant access to any additional resource
        within Lucid.
      operationId: documentEmbedsToken
      tags:
      - Document Embedding
      security:
      - OAuth2:
        - lucidchart.document.app.picker.share.embed
        - lucidscale.document.app.picker.share.embed
        - lucidspark.document.app.picker.share.embed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                embedId:
                  type: string
                  format: uuid
                  description: ID of the document embed. This is needed for viewing an existing embed.
                origin:
                  type: string
                  description: The URL (including protocol) of the webpage that will host the embed. Must
                    use the `https://` scheme (e.g., `https://example.com`, `http://localhost`).
                  example: https://example.com
                sessionConfig:
                  $ref: '#/components/schemas/SessionConfig'
              required:
              - origin
      responses:
        '200':
          description: Valid token that can be used to embed a document picker or a document viewer.
          content:
            application/jwt:
              schema:
                type: string
        '400':
          description: Bad Request. Occurs when `origin` is missing a protocol, uses an unsupported scheme,
            or is not a valid URL.
        '401':
          description: Access token is missing or invalid.
        '403':
          description: Access to the embed is forbidden.
        '404':
          description: The embed id in the parameter is not found.
  /v1/folders/{id}:
    get:
      summary: Get Folder
      description: Retrieves information about the requested folder.
      operationId: getFolder
      tags:
      - Folders
      security:
      - ApiKey:
        - FolderReadonly
      - OAuth2:
        - folder:readonly
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the folder to be retrieved.
      responses:
        '200':
          description: OK with a Folder resource containing information about the requested folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '403':
          description: Forbidden if the app making the request does not have permission to the folder,
            or if the folder has been deleted (trashed is okay) or does not exist.
    patch:
      summary: Update Folder
      description: 'Allows the requester to modify certain fields on a folder.


        When updating the parent field, the folder moves to the new parent location while its contents
        remain intact. The requesting user must have both edit and share access to both the old and new
        parent folders, or the entire update will fail.


        It is not permitted to update the parent field on Team Folders. Moving folders into or out of
        Team Folders may encounter permission-related errors, but once a folder is within a Team Folder,
        reorganization among descendants within that Team Folder can proceed without permission issues.

        '
      operationId: updateFolder
      tags:
      - Folders
      security:
      - ApiKey:
        - FolderEdit
      - OAuth2:
        - folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the folder to be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: New name for the folder being updated.
                parent:
                  type: number
                  nullable: true
                  description: New parent for the folder being updated. Causes the folder to be moved
                    into another folder if an ID is provided or into the user's root folder ("My Documents")
                    if `null` is provided. If the parent field is not included in the request, the folder
                    will not be moved. Cannot be provided for Team Folders.
      responses:
        '200':
          description: OK with a Folder resource containing information about the updated folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          description: Bad Request if the parent field is included in a request for a team folder, or
            if invalid input types are provided for id, name, or parent.
        '403':
          description: Forbidden if the app making the request does not have permission to the folder,
            the folder has been deleted or does not exist, or the request was not authorized to move the
            folder.
  /v1/folders:
    post:
      summary: Create Folder
      description: Creates a new folder.
      operationId: createFolder
      tags:
      - Folders
      security:
      - ApiKey:
        - FolderEdit
      - OAuth2:
        - folder
        - lucidchart.document.app.folder
        - lucidspark.document.app.folder
        - lucidscale.document.app.folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the folder being created.
                type:
                  $ref: '#/components/schemas/FolderType'
                parent:
                  nullable: true
                  description: Destination folder or repository to create the new folder in. For repositories,
                    use the repository ID prefixed with `repo_` (e.g., `repo_12345`). For folders, use
                    the numeric folder ID. If it is not provided, the folder will be created in the root
                    of the user's folder manager ("My Documents"). Ignored when `appFolder` is set to
                    `true`.
                  oneOf:
                  - type: integer
                    description: Numeric folder ID.
                  - type: string
                    description: Repository ID prefixed with `repo_`.
                  example: 12345
                appFolder:
                  type: boolean
                  description: 'When set to `true`, the folder is created inside the OAuth2 client''s
                    app project folder, overriding the `parent` field. Required when using a `document.app.folder`
                    scope without a `folder` scope.

                    '
              required:
              - name
              - type
      responses:
        '201':
          description: Created with a Folder resource containing information about the newly created folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '400':
          description: Bad Request. * A team folder cannot be created within another folder or team. *
            Invalid parent ID. Must be either a string prefixed with repo_ (for repositories) or a number.
            * When using a `document.app.folder` scope, `appFolder` must be set to `true`.
        '403':
          description: 'Forbidden if the request is not authorized to create in the specified `parent`
            folder or repository, or when using a `document.app.folder` scope without setting `appFolder`
            to `true`.

            '
  /v1/folders/{id}/trash:
    post:
      summary: Trash Folder
      description: Moves the given folder and all of its contents into the trash.
      operationId: trashFolder
      tags:
      - Folders
      security:
      - ApiKey:
        - FolderEdit
      - OAuth2:
        - folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the folder to be moved to the trash.
      responses:
        '204':
          description: No Content when the folder is successfully moved into the trash or is already trashed.
        '403':
          description: Forbidden if the app making the request does not have permission to the folder,
            or if the folder has been deleted or does not exist.
  /v1/folders/{id}/restore:
    post:
      summary: Restore Folder
      description: Moves a trashed folder and all of its contents back to their original pre-trash locations.
      operationId: restoreFolder
      tags:
      - Folders
      security:
      - ApiKey:
        - FolderEdit
      - OAuth2:
        - folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the folder to be restored from the trash.
      responses:
        '204':
          description: No Content when the folder is successfully moved out of the trash or is already
            not in the trash.
        '403':
          description: Forbidden if the app making the request does not have permission to the folder,
            or if the folder has been deleted or does not exist.
  /v1/folders/search:
    post:
      summary: Search Folders
      description: 'Retrieves information about folders the authenticated user has at least read-only
        access to. Admin requests using the `Lucid-Request-As: admin` header return all account folders;
        this capability is exclusive to Enterprise Shield accounts. Results are sorted by creation date
        and paginated. Rate limited to 300 requests per 5 seconds per account.'
      operationId: searchFolders
      tags:
      - Folders
      security:
      - ApiKey:
        - FolderReadonly
        - FolderAdmin
      - OAuth2:
        - folder:readonly
        - folder:admin.readonly
        - lucidchart.document.app.folder
        - lucidspark.document.app.folder
        - lucidscale.document.app.folder
      parameters:
      - $ref: '#/components/parameters/RequestAs-Folders'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/FolderType'
                  description: 'Note: This endpoint only accepts the folder type'
                userIds:
                  type: array
                  items:
                    type: number
                  description: 'If provided, limit the search to folders that at least one specified user
                    can access.

                    Without a list, the system searches the entire account (admin-level) or only folders
                    the authenticated user can access (user-level).

                    '
                ownedByUsers:
                  type: boolean
                  description: When true, search results will only include folders owned by users specified
                    by userIds. Ignored if no userIds are provided.
                keywords:
                  type: string
                  description: Keywords to search against folder content and titles. This field is truncated
                    to 400 characters. When provided, results will be sorted by relevance to keyword search.
                appFolder:
                  type: boolean
                  description: 'When set to `true`, restricts search results to folders within the OAuth2
                    client''s app project folder. Required when using a `document.app.folder` scope without
                    a `folder:readonly` scope.

                    '
      responses:
        '200':
          description: OK with an array of Folder Resource objects containing information about folders
            the authenticated user has access to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
        '400':
          description: 'Bad Request.

            * The request does not contain a body.

            * When using a `document.app.folder` scope, `appFolder` must be set to `true`.

            '
        '403':
          description: 'Forbidden.

            * User requests with admin scope and without Lucid-Request-As=admin header.

            * User requests without an admin scope and includes Lucid-Request-As=admin header.

            * Account does not have access to the API.

            * When using a `document.app.folder` scope without setting `appFolder` to `true`.

            '
        '429':
          description: Too Many Requests if the account makes more than 300 requests in 5 seconds.
  /v1/folders/{id}/contents:
