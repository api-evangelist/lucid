      - name: embedId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document embed to retrieve.
        example: ec890631-c150-461c-992f-b96533aa05f4
      responses:
        '200':
          description: OK. Returns a Document Embed Resource containing information about the requested
            document embed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedDocument'
        '403':
