      summary: Search Users By Email
      description: Retrieves information about all users on the authenticated account whose email is provided.
        Matching is case-insensitive and requires an exact match; emails that do not correspond to a user
        on the account are excluded from results.
      operationId: userEmailSearch
      tags:
      - Users
      security:
      - ApiKey:
        - AccountReadonly
      - OAuth2:
        - account.user:readonly
      requestBody:
        content:
          application/json:
            schema:
              properties:
                emails:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: OK. Returns a list of Profile resources containing information about users on the
            account. Emails that could not be matched are not included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '400':
          description: Bad Request. Occurs if the request body emails exceed 200 items or if any of the
            strings in the request body can not be parsed into the email format.
  /v1/users/me/profile:
    get:
      summary: Get Profile
      description: Retrieves basic information about the authenticated user.
      operationId: getUserProfile
      tags:
      - Users
      security:
      - ApiKey:
        - User
      - OAuth2:
        - user.profile
      responses:
        '200':
          description: OK. Returns a Profile resource containing information about the requesting user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Not Found
  /v1/describeLink:
    post:
      summary: Describe Link
      description: 'Retrieve metadata about a Lucid document from its URL, including the document title,
        product, and type. Use this to generate rich link previews (unfurling) in external applications.

        '
      operationId: describeLink
      tags:
      - Unfurling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: The URL of the Lucid document link to parse information from.
      responses:
        '200':
          description: Successfully retrieved information about the document link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResource'
        '403':
          description: The URL is not a valid Lucid link.
      security:
      - ApiKey: []
      - OAuth2: []
  /v1/embeds/link:
    get:
      summary: Direct Embed
      description: Display an embed within an iframe. If the clientId is valid with the registered embed
        domain in the developer portal, the iframe will show either a login page or an embedded document
        viewer depending on the user's authorization status via browser cookies.
      operationId: directEmbed
      tags:
      - Unfurling
      parameters:
      - name: document
        in: query
        required: true
        schema:
          type: string
        description: The URL of the Lucid document link or the documentId retrieved from the Describe
          Link endpoint.
      - name: clientId
        in: query
        required: true
        schema:
          type: string
        description: The client ID obtained during App registration.
      responses:
        '200':
          description: OK - The iframe content displaying the embedded document picker or viewer.
        '400':
          description: Bad Request
  /v1/documents/{documentId}/embeds/{embedId}:
    get:
      summary: Get Document Embed
      description: Retrieves limited metadata about the embedded document. If the embed is a snapshot-version
        embed, the metadata will be drawn from the state of the document at the time that the snapshot
        was created.
      operationId: getEmbedInformation
      tags:
      - Embedding Utils
      security:
      - OAuth2:
        - lucidchart.document.content.share.embed:readonly
        - lucidchart.document.app.picker.share.embed:readonly
        - lucidscale.document.content.share.embed:readonly
        - lucidscale.document.app.picker.share.embed:readonly
        - lucidspark.document.content.share.embed:readonly
        - lucidspark.document.app.picker.share.embed:readonly
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the embedded document to retrieve.
        example: 001bd56d-1b10-4196-8ac6-45e3c22bd1c6
      - name: embedId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document embed to retrieve.
        example: ec890631-c150-461c-992f-b96533aa05f4
      responses:
        '200':
          description: OK. Returns a Document Embed Resource containing information about the requested
            document embed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedInformation'
        '403':
          description: Forbidden. Occurs when the authorized token does not have permission to access
            the requested document or embed, or when the requested document or embed does not exist.
    delete:
      summary: Delete Document Embed
      description: Deletes an existing document embed. This will cause the document viewer to fail when
        attempting to load this document embed.
      operationId: deleteEmbed
      tags:
      - Embedding Utils
      security:
      - OAuth2:
        - account.info
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the embedded document to retrieve.
        example: 001bd56d-1b10-4196-8ac6-45e3c22bd1c6
      - name: embedId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document embed to retrieve.
        example: 298f9a4a-09b5-440c-b95e-4d5c2d1aaf49
      responses:
        '204':
          description: OK. Occurs when the document embed is deleted successfully.
        '403':
          description: Forbidden. Occurs when the access token isn't allowed to delete the embed.
  /v1/documents/{documentId}/embeds/{embedId}/document:
    get:
      summary: Get Document Embed Document
      description: Retrieves limited metadata about an embedded document. If the embed is a snapshot-version
        embed, the metadata will be drawn from the state of the document at the time that the snapshot
