      - OAuth2:
        - lucidchart.document.content.share.link
        - lucidchart.document.app.picker.share.link
        - lucidchart.document.app.folder
        - lucidscale.document.content.share.link
        - lucidscale.document.app.picker.share.link
        - lucidscale.document.app.folder
        - lucidspark.document.content.share.link
        - lucidspark.document.app.picker.share.link
        - lucidspark.document.app.folder
      parameters:
      - $ref: '#/components/parameters/DocumentShareLinkDocumentId'
      - $ref: '#/components/parameters/DocumentShareLinkShareLinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  $ref: '#/components/schemas/SharingRole'
                linkSecurity:
                  $ref: '#/components/schemas/DocumentLinkSecurity'
      responses:
        '200':
          description: OK with a Document Share Link resource containing information about the updated
            share link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentShareLink'
        '400':
          description: Bad Request if the the document does not belong to an enterprise account and the
            restrictToAccount is set to true, defines a passcode, or defines an expiration or the allowAnonymous
            field is set to true on non-Lucidspark/Lucidchart documents.
        '403':
          description: Forbidden if the app making the request does not have permission to the document,
            or if the document has been deleted, or does not exist.
        '404':
          description: Not Found if the share link id with the specified document id does not belong to
            the document, does not exist, or the requesting app did not create the share link.
    delete:
      summary: Delete Document Share Link
      description: Deletes a share link on a document. This endpoint will only delete share links that
        were created by the same OAuth2.0 client making the request.
      operationId: deleteDocumentShareLink
      tags:
      - Documents Sharing
      security:
      - OAuth2:
        - lucidchart.document.content.share.link
        - lucidchart.document.app.picker.share.link
        - lucidchart.document.app.folder
        - lucidscale.document.content.share.link
        - lucidscale.document.app.picker.share.link
        - lucidscale.document.app.folder
        - lucidspark.document.content.share.link
        - lucidspark.document.app.picker.share.link
        - lucidspark.document.app.folder
      parameters:
      - $ref: '#/components/parameters/DocumentShareLinkDocumentId'
      - $ref: '#/components/parameters/DocumentShareLinkShareLinkId'
      responses:
        '204':
          description: No Content if the share link was deleted successfully.
        '403':
          description: Forbidden if the app making the request does not have permission to the document,
            or if the document has been deleted, or does not exist.
        '404':
          description: Not Found if the share link id with the specified document id does not belong to
            the document, does not exist, or the requesting app did not create the share link.
