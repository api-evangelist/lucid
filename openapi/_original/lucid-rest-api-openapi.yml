        - lucidchart.document.content:readonly
        - lucidchart.document.app.picker:readonly
        - lucidchart.document.app.folder
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to have contents retrieved.
        example: 110808fd-4553-4316-bccf-4f25ff59a532
      responses:
        '200':
          description: OK with Document Content resource containing information about the requested document's
            content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentContent'
        '403':
          description: Forbidden if the app making the request does not have permission to the document,
