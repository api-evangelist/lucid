  /v1/documents/{id}/embeds:
    post:
      summary: Create Document Embed
      description: Creates an embed resource associated with a particular document. The request must be
        authenticated with an OAuth 2.0 token that has access to the document being embedded.
      operationId: createEmbed
      tags:
      - Embedding Utils
      security:
      - OAuth2:
        - lucidchart.document.content.share.embed
        - lucidchart.document.app.picker.share.embed
        - lucidscale.document.content.share.embed
        - lucidscale.document.app.picker.share.embed
        - lucidspark.document.content.share.embed
        - lucidspark.document.app.picker.share.embed
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document to be embedded.
        example: 001bd56d-1b10-4196-8ac6-45e3c22bd1c6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                embedVersion:
                  type: string
                  enum:
                  - latest-version
                  - snapshot-version
                  example: snapshot-version
                  description: Determines what version of the document will be loaded in the document
                    viewer.
              required:
              - embedVersion
      responses:
        '201':
          description: OK. Returns a Document Embed Resource containing information about the newly created
            document embed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedInformation'
        '400':
          description: Bad Request. Occurs if the embed version provided in the request body is invalid.
        '403':
          description: Forbidden. Occurs when the access token isn't allowed to create an embed for this
            document.
  /v1/documents/{documentId}/embeds/{embedId}/changeVersion:
    post:
      summary: Change Document Embed Version
      description: Updates the version type of an existing document embed. When called with an embedVersion
        of "snapshot-version", the endpoint associates the existing embed with a snapshot of the document's
        current state. Updating an embed's version to snapshot-version cannot be reversed.
      operationId: changeEmbedVersion
      tags:
      - Embedding Utils
      security:
      - OAuth2:
        - lucidchart.document.content.share.embed
        - lucidchart.document.app.picker.share.embed
        - lucidscale.document.content.share.embed
        - lucidscale.document.app.picker.share.embed
        - lucidspark.document.content.share.embed
        - lucidspark.document.app.picker.share.embed
      parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the embedded document to retrieve.
        example: 001bd56d-1b10-4196-8ac6-45e3c22bd1c6
      - name: embedId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: ID of the document embed to retrieve.
        example: 298f9a4a-09b5-440c-b95e-4d5c2d1aaf49
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                embedVersion:
                  type: string
                  enum:
                  - latest-version
                  - snapshot-version
                  example: snapshot-version
                  description: Determines what version of the document will be loaded in the document
                    viewer.
              required:
              - embedVersion
      responses:
        '200':
          description: OK. Returns a Document Embed Resource containing information about the updated
            document embed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedInformation'
        '400':
          description: Bad Request. Occurs if the embed version provided in the request body is invalid.
        '403':
          description: Forbidden. Occurs when the access token isn't allowed to change the embed version.
  /v1/documents/pickerToken:
    post:
      summary: Generate Document Picker Token
      description: Generates a token that can be used to embed a document picker for the specified product.
        Only documents for the specified product are shown in the picker.
      operationId: generateDocumentPickerToken
      tags:
      - Document Picker
      security:
      - OAuth2:
        - lucidchart.document.app.picker
        - lucidscale.document.app.picker
        - lucidspark.document.app.picker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: string
                  description: Determines which product is used for the document picker. Only documents
                    for this product are shown.
                  enum:
                  - lucidchart
                  - lucidscale
                  - lucidspark
                  example: lucidchart
                targetOrigin:
                  type: string
                  description: The domain that will be used to host the webpage in which the document
                    picker will be embedded. This will be used as the targetOrigin parameter in a call
                    to window.postMessage when the user selects a document.
                  example: https://example.com
      responses:
        '200':
          description: OK - with valid token that can be used to embed a document picker.
          content:
            application/jwt:
              schema:
                type: string
        '400':
          description: Bad Request - when parameters are missing or invalid.
        '403':
          description: Forbidden - when the access token is not allowed to generate a document picker
            token for the provided product.
  /v1/documents/picker?token=:token:
    get:
      summary: Embedded Document Picker
      description: Displays an embedded document picker within an iframe, allowing users to browse and
        select documents. Supports optional document creation and auto-selection of newly created documents.
      operationId: embeddedDocumentPicker
      tags:
      - Document Picker
      security:
      - OAuth2: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
        description: The document picker token retrieved from the Generate Document Picker Token endpoint.
      - name: allowDocumentCreation
        in: query
        required: false
        schema:
          type: boolean
        description: Enables the document picker user to create new documents. By default, created documents
          are not auto selected unless autoSelectCreatedDocument is set to true.
      - name: autoSelectCreatedDocument
        in: query
        required: false
        schema:
          type: boolean
        description: Enables the document picker to automatically select newly created documents.
      - name: newDocumenbtTitleSuggestion
        in: query
        required: false
        schema:
          type: string
        description: When create button is enabled, it suggests a default title for the new document.
      - name: hideCancelButton
        in: query
        required: false
        schema:
          type: boolean
        description: Determines whether the document picker hides the cancel button.
      - name: onErrorRedirectUrl
        in: query
        required: false
        schema:
          type: string
        description: The URL to redirect the user back to if the document picker raises an error.
      responses:
        '200':
          description: The iframe content displaying the embedded document picker.
          content:
            text/html:
              schema:
                type: string
  /v1/auditLogs:
    get:
      summary: Get Audit Logs
      description: Retrieves audit log events for the account. This API is exclusive to Enterprise Shield
        accounts. This endpoint is paginated.
      operationId: getAuditLogs
      tags:
      - Audit Logs
      security:
      - OAuth2:
        - account.audit.logs
      parameters:
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: The timestamp from which the audit logs will be returned. Defaults to 180 days prior
          to the current timestamp.
        example: '2021-01-01T00:00:00Z'
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: The timestamp to which the logs will be returned. Defaults to the current timestamp.
        example: '2021-01-01T00:00:00Z'
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 200
        description: The number of audit logs to return per request.
        example: 100
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: A token used for pagination to retrieve the next page of results when polling audit
          logs.
        example: eyJvIjoiMjAyNC0wOS0wNFQxNzoxNDoyOS4zNjA5NzhaXzU4ODk4NTkxNCJ9
      responses:
        '200':
          description: OK. Returns an array of audit log events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '400':
          description: Bad request. Occurs when the query parameters are invalid.
        '403':
          description: Forbidden. Occurs when the authorized token does not have permission to access
            audit logs.
  /v1/auditLogs/query:
    post:
      summary: Query Audit Logs
      description: Queries audit log events for the account using filter criteria specified in the request
        body. This API is exclusive to Enterprise Shield accounts. This endpoint is paginated.
      operationId: queryAuditLogs
      tags:
      - Audit Logs
      security:
      - OAuth2:
        - account.audit.logs
      parameters:
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 200
        description: The number of audit logs to return per request.
        example: 100
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: A token used for pagination to retrieve the next page of results when polling audit
          logs.
        example: eyJvIjoiMjAyNC0wOS0wNFQxNzoxNDoyOS4zNjA5NzhaXzU4ODk4NTkxNCJ9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditLogQueryRequestBody'
      responses:
        '200':
          description: OK. Returns an array of audit log events matching the query.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
        '400':
          description: Bad request. Occurs when the query parameters are invalid.
        '403':
          description: Forbidden. Occurs when the authorized token does not have permission to access
            audit logs.
  /v1/teams:
    get:
      summary: List Teams
      description: 'Retrieves information about teams the authenticated user has at least read-only access
        to.


        The list of teams returned depends on whether the request was made using user or admin permissions.
        User permissions return teams the requesting user has access to. Admin permissions return all
        teams belonging to the account.


        This endpoint is paginated.

        '
      operationId: listTeams
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsReadonly
        - TeamsAdmin
      - OAuth2:
        - teams:readonly
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      - name: filter
        in: query
        required: false
        schema:
          type: string
          enum:
          - include=memberonly
        description: The filter to apply to the returned teams. The only supported filter is "include=memberonly",
          which returns only teams that the requesting user is a member of. If no filter is provided,
          all `open` and `closed` teams on the account are returned, along with `hidden` teams that the
          requesting user is a member of.
        example: include=memberonly
      responses:
        '200':
          description: OK. Returns a list of Team resources containing information about teams directly
            accessible to the authenticated user. If requesting as admin, the list includes all teams
            on the account. If a filter is specified, only teams matching the filter are returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
    post:
      summary: Create Team
      description: 'Creates a new team for the authenticated user, populated with the given team members.
        Hidden teams cannot be created via the REST API.


        Whether the requesting user is automatically added to the team depends on the permission type.
        With user permissions, the user is automatically added to the team. With admin permissions, the
        user is not automatically added.

        '
      operationId: createTeam
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsEdit
        - TeamsAdmin
      - OAuth2:
        - teams
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamBody'
      responses:
        '201':
          description: Created. Returns a Team resource containing information about the created team.
            If requesting as admin, the user making the request will not have been automatically included
            as a user on the team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Bad Request. Occurs if the name in the request body is empty or exceeds the maximum
            allowed length.
        '403':
          description: Forbidden. Occurs if the user making the request does not have permission to create
            teams.
        '409':
          description: Conflict. Occurs if a team already exists with an identical name.
  /v1/teams/{id}:
    get:
      summary: Get Team
      description: 'Retrieves information about a requested team. The response depends on the permission
        type used: user permissions require that the authenticated user has access to the team, while
        admin permissions allow access to any team belonging to the account.'
      operationId: getTeam
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsReadonly
        - TeamsAdmin
      - OAuth2:
        - teams:readonly
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the team to get.
        example: 99
      responses:
        '200':
          description: OK. Returns a Team resource containing information about the specified team. If
            requesting as admin, a Team resource may be returned even if the authenticated user does not
            have direct access to the specified team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '403':
          description: Forbidden. * if the user making the request does not have access to the specified
            team. * if the team is not directly accessible by the authenticated user or does not exist.
    patch:
      summary: Update Team
      description: Updates the properties of an existing team, such as its name or type. With user permissions,
        the team must be one the requesting user has edit access to. With admin permissions, any team
        belonging to the account can be updated.
      operationId: updateTeam
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsEdit
        - TeamsAdmin
      - OAuth2:
        - teams
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the team to update.
        example: 99
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamBody'
      responses:
        '200':
          description: OK. Returns a Team resource containing information about the updated team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '400':
          description: Bad Request. Occurs if the name in the request body is empty or exceeds the maximum
            allowed length.
        '403':
          description: Forbidden. * if the user making the request does not have access to the specified
            team. * if the team is not directly accessible by the authenticated user or does not exist.
            * if the team is managed via SCIM. Use the SCIM Groups API to modify SCIM-managed teams.
        '409':
          description: Conflict. Occurs if a team already exists with an identical name.
  /v1/teams/{id}/users:
    get:
      summary: List Users on Team
      description: 'Retrieves basic information about users on a specified team. With user permissions,
        the authenticated user must have access to the team. With admin permissions, users from any team
        belonging to the account can be retrieved.


        This endpoint is paginated.

        '
      operationId: listUsersOnTeam
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsReadonly
        - TeamsAdmin
      - OAuth2:
        - teams:readonly
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the team to be queried.
        example: 99
      responses:
        '200':
          description: OK. Returns a list of Profile resources containing basic information about users
            on the specified team. If requesting as admin, Profile resources may be returned even if the
            authenticated user does not have direct access to the specified team.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '403':
          description: Forbidden. * if the user making the request does not have access to the specified
            team. * if the team has been archived, is not directly accessible by the authenticated user,
            or does not exist.
  /v1/teams/{id}/users/add:
    post:
      summary: Add Users to Team
      description: Adds users to a specified team with assigned roles. With user permissions, the team
        must be one the requesting user has edit access to. With admin permissions, users can be added
        to any team belonging to the account.
      operationId: addUsersToTeam
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsEdit
        - TeamsAdmin
      - OAuth2:
        - teams
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the team to which to add users.
        example: 99
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUsersToTeamBody'
      responses:
        '204':
          description: No Content. The users were successfully added to the team with their assigned roles.
            If requesting as admin, users may have been added even though the authenticated user does
            not have direct access to the specified team.
        '403':
          description: Forbidden. * if not all the specified users are on the authenticated account. *
            if the user making the request does not have permission to edit teams. * if the user making
            the request does not have access to the specified team. * if the team is managed via SCIM.
            Use the SCIM Groups API to modify SCIM-managed teams.
  /v1/teams/{id}/users/remove:
    post:
      summary: Remove Users from Team
      description: Removes users from a specified team. With user permissions, the team must be one the
        requesting user has edit access to. With admin permissions, users can be removed from any team
        belonging to the account.
      operationId: removeUsersFromTeam
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsEdit
        - TeamsAdmin
      - OAuth2:
        - teams
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the team from which to remove users.
        example: 99
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveUsersFromTeamBody'
      responses:
        '204':
          description: No Content. The users were successfully removed from the team. If requesting as
            admin, users may be have been removed even if the authenticated user does not have direct
            access to the specified team.
        '400':
          description: Bad Request. * if the user making the request attempts to remove all users from
            the team. * if not all the specified users are members of the team.
        '403':
          description: Forbidden. * if the user making the request does not have permission to edit teams.
            * if the user making the request does not have access to the specified team. * if the team
            is managed via SCIM. Use the SCIM Groups API to modify SCIM-managed teams.
  /v1/teams/{id}/archive:
    post:
      summary: Archive Team
      description: Archives a team, making it inactive. With user permissions, the team must be one the
        requesting user has edit access to. With admin permissions, any team belonging to the account
        can be archived.
      operationId: archiveTeam
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsEdit
        - TeamsAdmin
      - OAuth2:
        - teams
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the team to be archived.
        example: 99
      responses:
        '204':
          description: No Content. The team was successfully archived. If requesting as admin, the specified
            team may have been archived even though the authenticated user did not have direct access
            to it.
        '403':
          description: Forbidden. * if the user making the request does not have permission to edit teams.
            * if the user making the request does not have access to the specified team. * if the team
            is managed via SCIM. Use the SCIM Groups API to modify SCIM-managed teams.
  /v1/teams/{id}/restore:
    post:
      summary: Restore Team
      description: Restores a previously archived team. With user permissions, the team must be one the
        requesting user has edit access to. With admin permissions, any team belonging to the account
        can be restored.
      operationId: restoreTeam
      tags:
      - Teams
      security:
      - ApiKey:
        - TeamsEdit
        - TeamsAdmin
      - OAuth2:
        - teams
        - teams:admin
      parameters:
      - $ref: '#/components/parameters/RequestAs-Teams'
      - name: id
        in: path
        required: true
        schema:
          type: number
        description: ID of the team to be restored.
        example: 99
      responses:
        '204':
          description: No Content. The team was successfully restored. If requesting as admin, the specified
            team may have been restored even though the authenticated user did not have direct access
            to it.
        '403':
          description: Forbidden. * if the user making the request does not have permission to edit teams.
            * if the user making the request does not have access to the specified team. * if the team
            is managed via SCIM. Use the SCIM Groups API to modify SCIM-managed teams.
