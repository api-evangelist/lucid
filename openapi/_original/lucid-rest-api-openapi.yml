    ApiKey:
      type: http
      scheme: bearer
  parameters:
    RequestAs-AccountDocuments:
      in: header
      name: Lucid-Request-As
      required: true
      description: 'If the requesting user is an account owner or document admin with the required permissions
        and they make the request

        with the value of “admin” as this header and include an admin scope, the request will be made
        using their admin

        permissions.

        '
      schema:
        type: string
      example: admin
    LegalHoldIdPath:
      in: path
      name: legalHoldId
      required: true
      description: Unique ID of the legal hold.
      schema:
        type: string
        format: uuid
    RequestAs-Folders:
      in: header
      name: Lucid-Request-As
      required: true
      description: 'If the requesting user is an account owner or folder admin with the required permissions
        and they make the request

        with the value of “admin” as this header and include an admin scope, the request will be made
        using their admin

        permissions.

        Account owners and document admins can access the admin version of folder search.

        '
      schema:
        type: string
      example: admin
    DocumentShareLinkDocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: ID of the document.
    DocumentShareLinkShareLinkId:
      name: shareLinkId
      in: path
      required: true
      schema:
        type: string
      description: Id of the share link to retrieve information for.
    RequestAs-Teams:
      in: header
      name: Lucid-Request-As
      required: false
      description: 'If the requesting user is an account owner, team admin, or team manager with the required
        permissions and they make

        the request with the value of “admin” as this header and include an admin scope, the request will
        be made using

        their admin permissions.

        '
      schema:
        type: string
      example: admin
